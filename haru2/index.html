#haru-v4{--ink:#102438;--green:#39764d;position:relative;isolation:isolate;width:100%;max-width:430px;height:calc(100dvh - 24px);padding:9px 7px 5px;margin:0 auto;border-radius:38px;border:2px solid #ffffffb8;background:linear-gradient(115deg,#ffffff28,#efffd017 58%,#ffffff33);box-shadow:inset 2px 2px 3px #fff,inset -3px -2px 5px #fff9,0 5px 16px #243d3430;backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);color:var(--ink)}
#haru-v4:before{content:'';position:absolute;inset:3px;border:1px solid #ffffffeb;border-radius:33px;box-shadow:inset 0 0 2px #fff;pointer-events:none;z-index:5}
#haru-v4:after{content:'';position:absolute;inset:-5px;border:1px solid #ffffffb0;border-radius:43px;box-shadow:inset 1px 0 3px white,0 0 4px #fff9;pointer-events:none;z-index:-1}
#haru-v4 button,#haru-v4 input,#haru-v4 textarea,#haru-v4 select{font:inherit;color:inherit}#haru-v4 button{border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;background:none}#haru-v4 button:focus-visible,#haru-v4 input:focus-visible,#haru-v4 textarea:focus-visible,#haru-v4 select:focus-visible{outline:2px solid #286140;outline-offset:2px}#haru-v4 button:disabled{opacity:.5;cursor:default}#haru-v4 svg{width:22px;height:22px;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#haru-v4 .shell{height:100%;min-height:0;display:flex;flex-direction:column}#haru-v4 .sidebar,#haru-v4 .eyebrow,#haru-v4 .bottom-note,#haru-v4 .round{display:none}#haru-v4 .main{display:flex;flex-direction:column;min-height:0;flex:1;padding:10px 2px 0;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:#71926a66 transparent}
#haru-v4 .top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:0 14px;margin-bottom:9px;flex-shrink:0}#haru-v4 h1{font:700 37px/1.3 'Gowun Batang',serif;letter-spacing:-2.2px;margin:0;color:#092c2e;text-shadow:0 1px 2px #fff,1px 0 #ffffffb8}#haru-v4 .spark{display:inline-block;color:#28664e;font:400 30px/1 Georgia,serif;vertical-align:top;margin:0 0 0 5px;filter:drop-shadow(0 1px 0 white)}#haru-v4 .top-date{font-size:15px;line-height:1.5;margin:3px 0 0;font-weight:600;color:#102638}#haru-v4 .top-date:after{content:'⌄';display:inline-block;font-size:17px;margin-left:7px;font-weight:400}#haru-v4:has(#settings.active) .top-date:after{display:none}.top-actions{display:flex;gap:8px;padding-top:8px}
#haru-v4 .add,#haru-v4 .small-link,#haru-v4 .glass-button,#haru-v4 .tiny{border:1px solid #fff;background:linear-gradient(145deg,#fffffff0,#ffffff63);border-radius:24px;color:#174730;box-shadow:inset 0 1px 2px #fff,0 1px 3px #2d4a3120;white-space:nowrap}#haru-v4 .add{font-size:14px;font-weight:500;padding:7px 13px}#haru-v4 .small-link{font-size:12px;padding:6px 12px}#haru-v4 .tiny{font-size:11px;padding:6px 10px}
#haru-v4 .filters{display:flex;gap:7px;margin:0 10px 7px;flex-shrink:0}#haru-v4 .chip{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;border:1px solid #fff;border-radius:23px;padding:7px 3px;font-size:11px;line-height:1.4;white-space:nowrap;background:linear-gradient(140deg,#ffffffa8,#ffffff3b);box-shadow:inset 0 1px 3px #fff,0 1px 2px #20382226;color:#142a3c}#haru-v4 .chip.active{background:linear-gradient(140deg,#659779,#28653f);color:#fff;box-shadow:inset 0 1px 3px #fff,0 1px 4px #19422245}#haru-v4 .dot{height:7px;width:7px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 1px #fff}

#haru-v4{--ink:#293c34;--green:#56846b;max-width:414px;border:1px solid #fafffbd9;border-radius:33px;background:linear-gradient(125deg,#f8fbf9c9,#e9f5efb5 65%,#f8fbf9c9);box-shadow:inset 1px 1px 2px #fff,inset -1px -1px 3px #c0d4c7,0 9px 30px #6787732b,0 0 0 3px #d6e9dd70;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
#haru-v4:before{inset:3px;border:1px solid #ffffffb5;border-radius:29px;box-shadow:inset 0 1px 2px #fff8}
#haru-v4:after{inset:-3px;border-color:#accbb780;border-radius:36px;box-shadow:0 1px 7px #8aac9530}
#haru-v4 .main{padding:14px 3px 0}
#haru-v4 .top{padding:0 12px;margin-bottom:12px;align-items:center;min-height:39px}
#haru-v4 .top h1{display:none}
#haru-v4 .top-date{font-size:21px;line-height:1.4;font-weight:600;letter-spacing:-.7px;color:#23362e;margin:0}
#haru-v4 .top-date:after{font-size:15px;margin-left:8px}
#haru-v4 .top-actions{padding:0}
#haru-v4 .add{background:#f8fbf9c7;color:#49755d;border:1px solid #fff;border-radius:15px;padding:7px 12px;font-size:13px;box-shadow:inset 0 1px 2px #fff,0 1px 2px #7e9c8720}
#haru-v4 .filters{margin:0 9px 11px;gap:6px}
#haru-v4 .chip{background:#e8efedcf;border:1px solid #fafffb;font-size:12px;padding:7px 4px;border-radius:19px;color:#496257;box-shadow:inset 0 1px 2px #fff8}
#haru-v4 .chip.active{background:linear-gradient(130deg,#9abbac,#729d85);color:#fff;border-color:#f4fff5;box-shadow:inset 0 1px 2px #fff7,0 1px 2px #799c8722}
#haru-v4 .chip[data-group="숲녘"]:not(.active){background:#f7e9ede0;color:#866776}
#haru-v4 .chip[data-group="연가당"]:not(.active){background:#fff4dfe0;color:#876c40}
#haru-v4 .calendar,#haru-v4 .agenda,#haru-v4 .settings-row{background:linear-gradient(125deg,#f8fbf9f2,#f8fbf9c9);border:1px solid #fff;border-radius:23px;box-shadow:inset 0 1px 2px #fff,0 2px 9px #7e9c8712}
#haru-v4 .cal-head{margin-bottom:10px}
#haru-v4 .month-title{font-size:18px;font-weight:500;color:#2d4036}
#haru-v4 .arrow{width:32px;height:32px;font-size:22px;background:#ffffff90;color:#658072;box-shadow:none;border-color:#fff9}
#haru-v4 .weekdays{font-size:11px;color:#718079}
#haru-v4 .weekdays>div:nth-child(6),#haru-v4 .weekdays>div:last-child,#haru-v4 .day:nth-child(7n),#haru-v4 .day:nth-child(7n+6){color:#6d8177}
#haru-v4 .day{font-size:14px;color:#2d3e36}
#haru-v4 .day.other{color:#bac7bf}
#haru-v4 .day.selected .num{width:34px;height:34px;background:linear-gradient(135deg,#98c8ac,#6ba887);border:1px solid white;box-shadow:0 1px 3px #577b6730;color:white}
#haru-v4 .day.today:not(.selected) .num{box-shadow:inset 0 0 0 1px #9abbac}
#haru-v4 .day.selected .dots{margin-top:-3px}
#haru-v4 .day .dots .dot{width:4px;height:4px}
#haru-v4 .toggle{color:#627b6d;font-size:11px}
#haru-v4 .switch{background:#dce7e0;border-color:#c0d2c7}
#haru-v4 .on .switch{background:#85ac95}
#haru-v4 #monthly>.agenda{min-height:137px}
#haru-v4 .handle:after{height:4px;width:34px;background:#b0c2b9;border:0;box-shadow:none}
#haru-v4 .agenda-title{font-size:15px;font-weight:500;letter-spacing:-.6px}
#haru-v4 .count{color:#719b80;font-size:11px}
#haru-v4 .small-link{background:#f8fbf9bb;border-color:#fff;font-size:12px;color:#5a866a;box-shadow:none}
#haru-v4 .event{border-color:#d9e4de8c;gap:8px;min-height:57px}
#haru-v4 .check{border-color:#9aaba2;background:#fff9;border-radius:8px;width:21px;height:21px}
#haru-v4 .check.done{background:#84b195;border-color:#84b195;color:#fff}
#haru-v4 .time{font-size:11px;color:#829087}
#haru-v4 .event-name{font-size:13px;color:#304337}
#haru-v4 .event-meta{font-size:10px;color:#819087}
#haru-v4 .badge{font-size:10px;border-radius:9px;background:#e4f2e9;padding:4px 7px}
#haru-v4 .chevron{font-size:20px;color:#819b8a}
#haru-v4 .empty{font-size:13px;color:#7e9487}
#haru-v4 .empty-icon{color:#7eab90}
#haru-v4 .week-strip{margin-bottom:18px}
#haru-v4 .week-day{font-size:11px;color:#788c7e}
#haru-v4 .week-day:nth-child(6),#haru-v4 .week-day:last-child{color:#6d8177}
#haru-v4 .week-day b{font-size:14px;font-weight:400}
#haru-v4 .week-day.active b{background:linear-gradient(130deg,#9ac9ac,#6ba887);border:1px solid white;box-shadow:0 1px 3px #688a7430}
#haru-v4 .week-tick>span{font-size:11px;color:#7a8c81}
#haru-v4 .week-tick>i{border-top:1px solid #d8e4dd9c}
#haru-v4 .week-events{border-left:1px solid #d6e1da;background:repeating-linear-gradient(to right,transparent 0,transparent calc(14.2857% - 1px),#dbe5e04a calc(14.2857% - 1px),#dbe5e04a 14.2857%)}
#haru-v4 .week-event{background:#e2f3e9;font-size:11px;padding:5px 6px;border-radius:5px;color:#355641}
#haru-v4 .week-event small{font-size:9px;color:#617c69}
#haru-v4 .section-heading{font-size:17px;font-weight:500;color:#304337}
#haru-v4 .today-tools{color:#79a489}
#haru-v4 .task-card .empty,#haru-v4 .today-agenda .empty{font-size:14px;color:#7c9384}
#haru-v4 .settings-row{min-height:58px;border-radius:18px;font-size:14px;padding:13px 14px}
#haru-v4 .setting-label{font-weight:400;color:#42594b;gap:11px}
#haru-v4 .setting-symbol{color:#81998b}
#haru-v4 .setting-symbol svg{stroke-width:1.5;width:24px;height:24px}
#haru-v4 .settings-row>span:last-child{font-size:12px;color:#83938a}
#haru-v4 .settings-row:not(.no-chevron):after{color:#8ca193;font-size:21px}
#haru-v4 .settings-row small{font-size:11px}
#haru-v4 .glass-button{color:#62816d;font-size:15px;font-weight:400;border-color:#fff;background:#f8fbf9c9;box-shadow:inset 0 1px 2px #fff,0 1px 4px #67887315}
#haru-v4 .maintenance{color:#869e8e}
#haru-v4 .mobile-nav{margin-top:7px;padding-top:9px;background:#f8fbf9e3;border-radius:21px;border-color:#fff;box-shadow:inset 0 1px 2px #fff,0 -1px 4px #9ab5a51a}
#haru-v4 .mobile-nav button{color:#8a9a90;font-size:10px;font-weight:400;gap:4px}
#haru-v4 .mobile-nav .ico{width:23px;height:23px;stroke-width:1.5}
#haru-v4 .mobile-nav button.active{color:#56896b;font-weight:500}
#haru-v4 .mobile-nav button.active .ico{fill:#8bb59a;stroke:#f8fff9;filter:drop-shadow(0 0 1px #508463)}
#haru-v4 .cover{border-radius:30px;background:#e6f2e9}
#haru-v4 .cover-img{object-position:center}
#haru-v4 .cover-brand{position:absolute;top:40%;left:0;width:100%;display:flex;align-items:center;flex-direction:column;text-align:center;color:#608b72;pointer-events:none;text-shadow:0 1px 2px #fff}

      <header class="top">

        <div class="top-actions"><button id="home-cover" class="round" type="button" aria-label="시작 화면 보기"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m4 11 8-7 8 7v9H4Z"/><path d="M9 20v-7h6v7"/></svg></button><button class="add" id="add" type="button">＋ 추가</button></div>

      <div class="filters" id="filters" aria-label="그룹 필터">
        <button type="button" class="chip active" data-group="전체" aria-pressed="true">전체</button>

      </div>
      <section class="view active" id="monthly" aria-label="월간 달력">
        <div class="calendar">
          <div class="cal-head"><button class="arrow" id="prev" type="button" aria-label="이전 달">‹</button><div class="month-title" id="month-label">월간</div><div class="cal-controls"><button class="tiny" id="today-btn" type="button">오늘</button><button class="arrow" id="next" type="button" aria-label="다음 달">›</button></div></div>
          <div class="weekdays" aria-hidden="true"><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div><div>일</div></div>
          <div class="days" id="days" aria-label="날짜"></div>
          <div class="cal-bottom"><span></span><button class="toggle" id="calendar-only" type="button" aria-pressed="false">달력만 보기<span class="switch" aria-hidden="true"></span></button></div>
        </div>
        <div class="agenda" id="agenda"><button class="handle" id="handle" type="button" aria-label="일정 패널 접기 또는 펼치기"></button><div class="agenda-head"><div class="agenda-title" id="selected-label">선택한 날짜</div><button class="small-link" id="agenda-add" type="button">＋ 추가</button></div><div id="agenda-list" aria-live="polite"></div></div>
      </section>
      <section class="view" id="weekly" aria-label="주간 일정"><div class="calendar week-calendar"><div class="cal-head"><button class="arrow" id="week-prev" type="button" aria-label="이전 주">‹</button><div class="month-title" id="week-label">주간</div><button class="arrow" id="week-next" type="button" aria-label="다음 주">›</button></div><div class="week-strip" id="week-strip"></div><div class="timeline" id="timeline"></div></div></section>

        <div class="settings-row"><span class="setting-label"><span class="setting-symbol" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="3"/><path d="M8 3v4m8-4v4M4 10h16"/></svg></span>한 주의 시작</span><span>월요일</span></div>
        <div class="settings-row"><span class="setting-label"><span class="setting-symbol" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6Z"/><path d="M14 3v5h5M9 12h7m-7 4h7"/></svg></span>저장 방식</span><span>구글 시트 「일정표」</span></div>
        <div class="settings-row"><span class="setting-label"><span class="setting-symbol" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21v-3a7 7 0 0 1 14 0v3Zm14-17a4 4 0 0 1 0 8m3 9h3v-3a7 7 0 0 0-4-6"/></svg></span>함께 쓰는 사람</span><span>규연 · 루에 · 이음</span></div>
        <div class="settings-row"><span class="setting-label"><span class="setting-symbol" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 17h14l-2-3V9a5 5 0 0 0-10 0v5Zm5 3h4M12 2v2"/></svg></span>알림</span><span>구글 캘린더<small>이음 등록</small></span></div>
