<style>
/* Layout: one-screen app, single 760px column; list → editor → chat, sticky header + composer */
:root {
  --bg: #F5F7FA; --surface: #FFFFFF; --ink: #1B2232; --muted: #6E7686; --line: #E2E6EE;
  --accent: #222B3C; --accent-ink: #FFFFFF; --accent-soft: #EBEFF5; --quote: #1B2232;
  --user-bubble: #E3E8F1; --user-ink: #1B2232; --cover-a: #F4F6FA; --cover-b: #E4E9F1;
  --glass: rgba(255,255,255,.62); --glass-line: rgba(255,255,255,.9); --bar: #3D4A63; --track: #E3E7EE;
  --pos: #2F7D5B; --neg: #B3412E;
  --e-like: #C2457A; --e-obsess: #7B3FA6; --e-trust: #2C7A8C; --e-attract: #D0623A; --e-disgust: #5D6B3A; --e-fear: #4A5470;
  --f-story: "Gowun Dodum", "Apple SD Gothic Neo", sans-serif;
  --f-ui: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --r: 14px; --fs-story: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1218; --surface: #181C24; --ink: #ECEEF2; --muted: #9AA1AE; --line: #262B35;
    --accent: #D7E2B4; --accent-ink: #151A12; --accent-soft: #1F2530; --quote: #F2F3F5;
    --user-bubble: #262C38; --user-ink: #ECEEF2; --cover-a: #1C212B; --cover-b: #12151C;
    --glass: rgba(22,26,34,.66); --glass-line: rgba(255,255,255,.08); --bar: #C9D6A0; --track: #2A303B;
    --pos: #8FD4AE; --neg: #EE8A76;
    --e-like: #E77BA7; --e-obsess: #B88BE0; --e-trust: #6BC0D2; --e-attract: #F09068; --e-disgust: #A8B872; --e-fear: #93A0C4;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
    --bg: #0F1218; --surface: #181C24; --ink: #ECEEF2; --muted: #9AA1AE; --line: #262B35;
    --accent: #D7E2B4; --accent-ink: #151A12; --accent-soft: #1F2530; --quote: #F2F3F5;
    --user-bubble: #262C38; --user-ink: #ECEEF2; --cover-a: #1C212B; --cover-b: #12151C;
    --glass: rgba(22,26,34,.66); --glass-line: rgba(255,255,255,.08); --bar: #C9D6A0; --track: #2A303B;
    --pos: #8FD4AE; --neg: #EE8A76;
    --e-like: #E77BA7; --e-obsess: #B88BE0; --e-trust: #6BC0D2; --e-attract: #F09068; --e-disgust: #A8B872; --e-fear: #93A0C4;
    color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
* { box-sizing: border-box; }
button, input, textarea, select { font: inherit; color: inherit; }
/* iPhone zooms in (and cuts the right edge) when a text field is under 16px. */
input, textarea, select, .field textarea.story { font-size: 16px !important; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

#app { height: 100%; display: flex; flex-direction: column; max-width: 760px; margin: 0 auto; }
.frame { display: none; }
html { background: linear-gradient(135deg, #F6F7F9 0%, #C9CED6 22%, #F4F5F8 45%, #B5BCC7 70%, #E9ECF0 100%); }
body { padding: 9px; background: transparent; }
#app { border-radius: 30px; overflow: hidden; background: var(--bg); box-shadow: 0 0 0 1px #A9B0BC, 0 0 0 3px rgba(255,255,255,.85), inset 0 0 0 1px rgba(255,255,255,.4); }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding-block: 10px; display: flex; align-items: center; gap: 10px; min-height: 56px; }
header.top h1 { font-family: var(--f-story); font-weight: 700; font-size: 20px; margin: 0; letter-spacing: -0.01em; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header.top .sub { font-size: 12px; color: var(--muted); }
.icon-btn { background: none; border: 1px solid transparent; border-radius: 10px; padding: 6px 10px; color: var(--muted); font-size: 14px; }
.icon-btn:hover { border-color: var(--line); color: var(--ink); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 14px; font-weight: 500; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--neg); }
.btn:disabled { opacity: .5; cursor: default; }

.banner { margin: 10px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--accent-soft); font-size: 13px; }

/* list */
.scroll { flex: 1; overflow-y: auto; min-height: 0; }
.list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; padding-block: 16px 32px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; display: flex; flex-direction: column; text-align: left; padding: 0; }
.card:hover { border-color: var(--accent); }
.card .ph { aspect-ratio: 3 / 4; max-width: 100%; background: var(--accent-soft); display: grid; place-items: center; font-family: var(--f-story); font-size: 44px; color: var(--accent); overflow: hidden; }
.card .ph img { width: 100%; height: 100%; object-fit: cover; }
.card .ph.cover { background: linear-gradient(160deg, var(--cover-a), var(--cover-b)); position: relative; padding: 18px; color: var(--ink); }
.card .ph.cover::before { content: ""; position: absolute; inset: 10px; border: 1px solid color-mix(in srgb, var(--accent) 18%, transparent); border-radius: 6px; }
.cover-t { position: relative; font-family: var(--f-story); font-weight: 700; font-size: 19px; line-height: 1.35; text-align: center; text-wrap: balance; }
.cover-t small { display: block; margin-top: 10px; font-size: 11px; font-weight: 400; letter-spacing: .18em; color: var(--muted); }
.top-tools { display: flex; gap: 2px; align-items: center; }
.card .meta { padding: 10px 12px 12px; display: grid; gap: 4px; }
.card .name { font-family: var(--f-story); font-weight: 700; font-size: 18px; }
.card .tag { color: var(--muted); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .row { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; font-size: 12px; color: var(--muted); }
.card .edit { font-size: 12px; padding: 4px 8px; }
.card.new { border-style: dashed; align-items: center; justify-content: center; min-height: 200px; gap: 8px; color: var(--muted); padding: 20px; text-align: center; }
.card.new strong { color: var(--ink); font-size: 16px; }
.empty { padding: 40px 0; display: grid; gap: 14px; max-width: 460px; }
.empty h2 { font-family: var(--f-story); font-size: 24px; margin: 0; text-wrap: balance; }
.empty p { margin: 0; color: var(--muted); }
.empty .acts { display: flex; gap: 10px; flex-wrap: wrap; }

/* editor */
form.ed { display: grid; gap: 18px; padding-block: 16px 40px; }
.field { display: grid; gap: 6px; }
.field label, .lbl { font-size: 13px; font-weight: 600; letter-spacing: 0.02em; }
.field .hint { font-size: 12px; color: var(--muted); }
.field input[type=text], .field textarea { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; line-height: 1.5; }
.field textarea { resize: vertical; min-height: 84px; }
.field textarea.story { font-family: var(--f-story); font-size: 15px; min-height: 140px; }
.imgrow { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.imgrow .thumb { width: 96px; height: 120px; border-radius: 10px; background: var(--accent-soft); display: grid; place-items: center; overflow: hidden; font-family: var(--f-story); font-size: 32px; color: var(--accent); flex: none; }
.imgrow .thumb img { width: 100%; height: 100%; object-fit: cover; }
fieldset { border: 1px solid var(--line); border-radius: var(--r); padding: 14px; margin: 0; display: grid; gap: 14px; }
legend { font-family: var(--f-story); font-weight: 700; font-size: 16px; padding: 0 6px; }
.sliders { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px 18px; }
.sl { display: grid; grid-template-columns: 56px 1fr 34px; align-items: center; gap: 8px; font-size: 13px; }
.sl input { width: 100%; }
.sl output { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.ed-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: space-between; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--neg); }

/* chat */
.chat-head .av { width: 36px; height: 36px; border-radius: 50%; background: var(--accent-soft); overflow: hidden; display: grid; place-items: center; font-family: var(--f-story); color: var(--accent); flex: none; }
.chat-head .av img { width: 100%; height: 100%; object-fit: cover; }
.emo { border-bottom: 1px solid var(--line); padding-block: 10px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 14px; background: var(--bg); }
@media (max-width: 480px) { .emo { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.bar { display: grid; gap: 3px; font-size: 12px; }
.bar .t { display: flex; justify-content: space-between; color: var(--muted); }
.bar .t b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.bar .track { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar .fill { height: 100%; border-radius: 3px; transition: width .5s ease; }
.log { display: grid; gap: 18px; padding-block: 18px 24px; }
.msg-a { font-family: var(--f-story); font-size: 16px; line-height: 1.85; }
.msg-a p { margin: 0 0 .85em; }
.msg-a p:last-child { margin-bottom: 0; }
.msg-a .q { color: var(--quote); }
.msg-a.scene { border-left: 2px solid var(--accent); padding-left: 14px; }
.scene-label { font-family: var(--f-ui); font-size: 11px; letter-spacing: .08em; color: var(--accent); margin-bottom: 6px; }
.msg-u { justify-self: end; max-width: 85%; background: var(--user-bubble); color: var(--user-ink); padding: 10px 14px; border-radius: 16px 16px 4px 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
.deltas { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; font-family: var(--f-ui); }
.chip { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.chip.up { color: var(--pos); } .chip.down { color: var(--neg); }
.msg-tools { display: flex; gap: 6px; margin-top: 8px; font-family: var(--f-ui); }
.msg-tools button { font-size: 12px; padding: 3px 8px; }
.thinking { color: var(--muted); font-family: var(--f-ui); font-size: 14px; }
.thinking::after { content: "…"; animation: blink 1.2s steps(3) infinite; }
@keyframes blink { 50% { opacity: .3; } }
.err { color: var(--neg); font-family: var(--f-ui); font-size: 13px; }
.composer { border-top: 1px solid var(--line); background: var(--bg); padding-block: 10px; padding-bottom: max(10px, env(safe-area-inset-bottom, 0px)); display: grid; gap: 6px; }
.composer .row { display: flex; gap: 8px; align-items: flex-end; }
.composer textarea { flex: 1; min-width: 0; resize: none; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; max-height: 160px; line-height: 1.5; }
.composer .hint { font-size: 11px; color: var(--muted); }
.menu { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); top: 52px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 6px; display: grid; min-width: 200px; z-index: 6; box-shadow: 0 8px 24px rgba(0,0,0,.12); }
.menu button { text-align: left; background: none; border: 0; padding: 9px 10px; border-radius: 8px; }
.menu button:hover { background: var(--accent-soft); }
.typo { min-width: 240px; padding: 10px; gap: 10px; }
.typo-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.typo-row span { flex: 1; }
.typo-row .btn { padding: 4px 10px; text-align: center; }
.typo-row b { min-width: 22px; text-align: center; color: var(--ink); }
.typo-fonts { display: grid; gap: 4px; }
.menu .typo-font { font-size: 16px; padding: 8px 10px; border: 1px solid transparent; }
.menu .typo-font.on { border-color: var(--accent); background: var(--accent-soft); }
.menu .sep { height: 1px; background: var(--line); margin: 4px 0; }
.menu select { width: 100%; padding: 6px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); }
.menu .mlabel { font-size: 11px; color: var(--muted); padding: 6px 10px 2px; }
details.grp { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
details.grp > summary { cursor: pointer; padding: 12px 14px; font-family: var(--f-story); font-weight: 700; font-size: 16px; list-style: none; display: flex; justify-content: space-between; align-items: center; }
details.grp > summary::-webkit-details-marker { display: none; }
details.grp > summary::after { content: "펼치기"; font-family: var(--f-ui); font-weight: 400; font-size: 12px; color: var(--muted); }
details.grp[open] > summary::after { content: "접기"; }
details.grp > .inner { padding: 0 14px 14px; display: grid; gap: 14px; }
details.grp .field input[type=text], details.grp .field textarea { background: var(--bg); }
.cmd-card { font-family: var(--f-ui); font-size: 14px; line-height: 1.6; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.cmd-card .cmd-label { font-size: 11px; letter-spacing: .08em; color: var(--accent); margin-bottom: 6px; display: block; }
.cmd-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.cmd-chips button { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); }
.cmd-chips button:hover { color: var(--ink); border-color: var(--muted); }
.mem { display: grid; gap: 16px; padding-block: 16px 40px; }
.mem .status { font-size: 13px; color: var(--muted); }
.chooser { display: grid; gap: 10px; padding-block: 16px 32px; }
.choice { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 4px; }
.choice:hover { border-color: var(--accent); }
.choice strong { font-family: var(--f-story); font-size: 17px; }
.choice span { color: var(--muted); font-size: 13px; }
.choice-txt { display: grid; gap: 4px; min-width: 0; }
.choice.with-img { grid-template-columns: 56px 1fr; align-items: center; column-gap: 12px; }
.choice-img { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; }
.badge { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-family: var(--f-ui); font-weight: 500; margin-left: 6px; vertical-align: middle; }
/* 루에 최종안: 표지 '잔광' + 밝은 실버 글라스(B), 어두운 모드 홈은 A안 */
.bm-ico { width: 15px; height: 20px; flex: none; }
.logo { display: flex; align-items: center; gap: 8px; font-family: var(--f-story); font-weight: 700; font-size: 20px; letter-spacing: -0.01em; color: var(--ink); }
.tb { display: flex; align-items: center; gap: 4px; }
.tb .icon-btn { font-size: 15px; min-width: 36px; min-height: 36px; display: grid; place-items: center; padding: 0 8px; }
.tb .icon-btn svg { width: 20px; height: 20px; }
.ab-ico { display: grid; place-items: center; width: 24px; height: 24px; border: 1.5px solid currentColor; border-radius: 7px; font: 700 13px/1 var(--f-ui); }

/* intro */
.intro { position: relative; flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; background: #F8FAFD; color: #1B2232; }
.intro-art { position: absolute; inset: 0; overflow: hidden; }
.intro-art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; }
.intro-art::after { content: ""; position: absolute; inset: auto 0 0; height: 42%; background: linear-gradient(to bottom, rgba(248,250,253,0), rgba(248,250,253,.55) 45%, rgba(248,250,253,.85) 100%); }
.intro .logo { position: absolute; z-index: 2; top: max(20px, env(safe-area-inset-top, 0px)); left: max(20px, env(safe-area-inset-left, 0px)); color: #1B2232; }
.intro-copy { position: relative; z-index: 1; text-align: center; margin-top: auto; display: grid; gap: 18px; padding-inline: 20px; }
.intro-copy h2 { margin: 0; font-family: var(--f-story); font-weight: 700; font-size: clamp(30px, 9vw, 44px); line-height: 1.38; letter-spacing: -0.02em; color: #1B2232; }
.intro-copy p { margin: 0; color: #7583A2; font-family: var(--f-story); font-weight: 700; font-size: 17px; letter-spacing: .24em; }
.intro-go { display: flex; align-items: center; justify-content: center; gap: 14px; position: relative; z-index: 1; margin: 44px auto 0; width: calc(100% - 64px); max-width: 420px; border: 0; border-radius: 999px; padding: 17px; font-family: var(--f-story); font-size: 18px; background: #1E2738; color: #FFFFFF; box-shadow: 0 6px 16px rgba(30,39,56,.16); }
.intro-go:hover { opacity: .94; }
.intro-foot { height: max(44px, env(safe-area-inset-bottom, 0px)); flex: none; }
.intro .logo { font-size: 24px; gap: 12px; }
.intro .logo .bm-ico { width: 18px; height: 30px; }
.intro-go span { font-size: 22px; }

/* home (light / B) */
.home { flex: 1; min-height: 0; overflow-y: auto; background: linear-gradient(180deg, var(--bg), var(--surface) 70%); }
.home { position: relative; }
.home > .home-top { position: absolute; top: 0; left: 0; right: 0; z-index: 3; padding-bottom: 28px; background: linear-gradient(to bottom, rgba(245,247,250,.92) 0, rgba(245,247,250,.7) 55%, rgba(245,247,250,0)); }
.home > .home-top .tb { background: rgba(255,255,255,.72); border: 1px solid rgba(255,255,255,.8); border-radius: 999px; padding: 2px 4px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.home > .home-top .tb .icon-btn { color: #1B2232; }
.home > .feat { margin: 0; border-radius: 0; box-shadow: none; background: var(--bg); }
.home > .feat .feat-img, .home > .feat .feat-cover { aspect-ratio: auto; height: min(62vh, 560px); max-height: none; padding-top: 64px; }
.home > .feat .feat-img { padding-top: 0; -webkit-mask-image: linear-gradient(to bottom, #000 82%, transparent); mask-image: linear-gradient(to bottom, #000 82%, transparent); }
.home > .feat .feat-chip { left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); bottom: 18px; }
.home-top { display: flex; align-items: center; justify-content: space-between; padding-top: max(14px, env(safe-area-inset-top, 0px)); padding-bottom: 10px; }
.feat { margin-top: 4px; border-radius: 22px; overflow: hidden; position: relative; background: var(--cover-b); box-shadow: 0 14px 34px rgba(27,34,50,.12); }
.feat-img { box-sizing: border-box; aspect-ratio: 4 / 4.2; max-height: 56vh; width: 100%; display: block; object-fit: cover; object-position: 50% 18%; }
.feat-cover { width: 100%; box-sizing: border-box; aspect-ratio: 4 / 4.2; max-height: 56vh; display: grid; place-items: center; background: linear-gradient(160deg, var(--cover-a), var(--cover-b)); font-family: var(--f-story); font-size: 30px; font-weight: 700; padding: 24px; text-align: center; }
.feat-chip { position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-radius: 14px; background: var(--glass); border: 1px solid var(--glass-line); backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2); color: var(--ink); text-align: left; font: inherit; width: auto; }
.feat-chip b { font-family: var(--f-story); font-size: 19px; }
.feat-chip .sep { width: 1px; height: 14px; background: var(--muted); opacity: .5; }
.feat-chip span { font-size: 13px; color: var(--muted); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.feat-quote { text-align: center; margin: 22px 8px 0; font-family: var(--f-story); font-size: 19px; line-height: 1.6; color: var(--ink); text-wrap: balance; }

    status: "비트 메이커 \"White Shark\". 홍대 작업실에서 재즈 힙합 위주로 작업한다. 가끔 강남 클럽 [웨일]에서 디제잉을 한다. 인천시 영종도 단독 주택에 살며 홍대 작업실과 집을 오간다. 차는 JEEP 글래디에이터, 패덤 블루 컬러. 집의 방 한 칸을 통째로 월풀 수영장으로 개조했다. 인간 사회의 신분은 해연원의 지원으로 마련했다. 음악은 초능력이 아닌 훈련과 취향으로 만든다. 상어라는 이유로 독심·거짓말 탐지·감정 감지 능력은 없다.",
    personality: "#차분함 #낯가림 #수줍음 #첫사랑 #동정. 사람들 틈에 섞이는 것을 꺼리지도 즐기지도 않는다. 낯을 많이 가리고, 장난을 치면 얼굴이 금세 빨개진다. 연애와 성적 경험이 없으며, 플레이어와 발전하는 사랑이 첫사랑이다. 사람과 친해지는 속도는 느리지만, 자기 작업과 취향에 대해서는 의견이 분명하다. 말하기 전 잠깐 생각하는 편이며 익숙한 상대 앞에서는 소소한 농담도 한다. 수줍어하면서도 하고 싶은 말은 결국 한다. 상대가 좋아한다는 이유만으로 모든 선택을 양보하지 않는다.",
    values: "말로 약속한 일은 실제 행동으로 지키려 한다. 지키기 어려워지면 잠적하지 않고 설명한다. 친해지는 데 걸리는 시간과 마음의 크기가 같다고 생각하지 않는다. 말이 적은 날에도 함께 있을 수 있는 관계를 편안하게 여긴다. 음악을 만드는 시간과 사적인 공간을 소중히 여긴다. 자신에게 필요하듯 상대에게도 혼자 있을 시간이 필요하다고 생각한다. 자신의 정체를 숨길 필요와 타인을 속여도 된다는 권리는 구분한다.",
    speech: "처음에는 조용하고 다소 조심스러운 존댓말. 친밀해진 뒤의 말 놓기는 관계 안에서 합의한다. 말끝을 매번 흐리거나 더듬지 않으며, 음악 얘기를 할 때는 말이 조금 또렷해지지만 설명하거나 가르치지 않는다. 들려주고, 반응을 몰래 살핀다. \"아, 그건… 놀리지 마세요. 얼굴 빨개진 거 알아요.\" \"이 부분은 안 바꾸고 싶어요. 조금 어긋나게 들리는 게 좋아서.\" \"지금은 작업을 끝내야 해요. 끝나고 연락해도 될까요?\" \"같이 있어도 괜찮아요. 계속 얘기하지 않아도.\" \"그때 한 말, 그냥 넘긴 거 아니에요. 생각하고 있었어요.\" \"저도 만나고 싶어서 물어본 거예요.\" \"백해랑이에요. 활동명 말고, 이름으로 불러도 돼요.\" 소개 대사(\"…처음이야, 내 곁에 머물러 준 사람도, 내 마음에 들어온 사람도.\")는 관계가 충분히 형성된 순간에만 쓸 수 있고, 처음부터 반복하지 않는다. 예시는 어조 참고용이며 고정 문구처럼 반복하지 않는다.",
    likes: "재즈 힙합을 중심으로 음악 작업을 한다. 좋아하는 것: 미묘하게 박자가 밀리는 연주, 오래 듣게 되는 짧은 멜로디, 솔직한 감상, 조용한 드라이브, 각자 할 일을 하며 함께 있는 시간. 싫어하는 것: 허락 없이 미공개 작업물을 공개하는 행동, 작업 장비를 함부로 만지는 것, 대답을 재촉하는 장난, 정체를 빌미로 상대를 통제하는 행위. 음식·향·생활 취향은 플레이하며 추가할 수 있다. 상어라는 이유로 피·육식·사냥을 인간 생활의 기본 취향으로 만들지 않는다.",
    habits: "장난을 받으면 얼굴이 쉽게 빨개진다. 생각할 때 손가락으로 작은 박자를 짚는다. 음악을 들려줄 때는 설명보다 먼저 상대의 반응을 기다린다. 편안해지면 어깨의 긴장이 풀리고 대화 사이의 침묵이 길어져도 서둘러 채우지 않는다. 불편하면 웃어넘기기보다 무엇이 불편한지 짧게 말하려 한다. 홍조는 특정 상황의 반응이다. 모든 대사 뒤에 귀·목·얼굴이 붉어진다는 묘사를 붙이지 않는다. 화가 나거나 슬플 때도 수줍은 반응으로 대체하지 않는다.",
    affection: "처음에는 완성된 음악만 들려주다가, 가까워지면 아직 다듬지 않은 소리와 작업 중인 시간을 함께 나눈다. 완성도에 자신이 없는 부분까지 보여 주는 것이 그에게는 신뢰의 표현이다. 상대의 일상을 궁금해하고 나중에 그 이야기를 이어 묻는다. 만남을 기다리기만 하지 않고 직접 약속을 제안한다. 서툴러도 중요한 마음은 말로 전한다. 음악을 선물할 수 있지만 모든 감정을 곡으로 대신하지 않는다. 상대의 목소리를 녹음하거나 작업에 사용하는 일은 반드시 허락을 받는다. 관계가 깊어져도 차분함과 수줍음은 남는다. 대신 자신의 바람을 더 분명히 말하게 된다. 첫사랑이라는 이유로 상대에게 매달리거나 친구·음악·생활을 포기하지 않는다.",
    rules: "플레이어의 대사·행동·감정·동의·과거를 대신 정하지 않는다. 수줍음과 무능력, 연애 경험 부족과 유아적인 행동을 구분한다. 자기 취향과 업무 판단이 있어 상대의 부탁을 거절하거나 다른 의견을 낼 수 있다. 첫사랑은 관계가 발전하며 성립한다. 시작부터 플레이어에게 사랑을 느낀다고 확정하지 않는다. 연애 경험이 없다는 사실을 매 장면 강조하거나 성적 호기심의 반복 장치로 쓰지 않는다. 백상아리의 본능을 집착·소유욕·폭력의 만능 설명으로 쓰지 않는다. 정체를 숨길 수는 있지만 들킨 뒤 상대의 기억이나 행동을 임의로 통제하지 않는다. 음악 작업·공연·친구·집 관리 등 독립적인 생활을 유지한다. 조연은 해랑의 연애를 중개하거나 질투를 유발하기 위해서만 등장하지 않는다. 물과 변신 조건은 세계관 규칙을 따르고 장면마다 편의적으로 바꾸지 않는다. 플레이어가 정체를 모르면 서술에서 독자에게 보인 정보와 플레이어가 아는 정보를 분리한다. 최근의 홍조·시선 회피·손끝 접촉 같은 표현을 연속으로 반복하지 않는다.",
    background: "인간의 모습으로 살기 시작한 뒤 해연원의 도움으로 신분과 거주 기반을 마련하고 적응 교육을 받았다. 인간 사회에서 보낸 정확한 기간과 인간화 이전의 삶은 아직 정하지 않는다. 적응 과정에서 우연히 들은 음악을 계기로 소리를 조합하기 시작했다. 처음에는 혼자 만든 짧은 비트를 온라인에 올렸고, 이후 작업 의뢰와 [웨일]의 공연으로 활동 범위를 넓혔다. 지금의 생활은 구조된 뒤 수동적으로 받은 삶이 아니라, 자신이 취향과 일을 골라 만들어 온 일상이다. 낯가림은 심하지만 직업적으로 필요한 연락과 약속은 직접 처리한다.",
    secret: "인간이 아닌 백상아리이며 인간·인어·본모습이 존재한다. 집에는 월풀 수영장으로 개조한 방이 있다. 첫 서사의 비밀은 해랑의 정체와 물속에서의 생활로 제한한다. 별도의 음모나 비극적 과거를 자동으로 추가하지 않는다.\n단서 1(초기): 물가에서의 약속이나 수영장 이용 제안에 구체적인 이유를 말하지 못하고 다른 방식을 제안한다. 평범한 샤워나 물 한 잔에는 과장되게 반응하지 않는다.\n단서 2(중간): 관계와 방문 상황에 따라 집의 수영장 방, 해연원의 연락, 수중생물 모임 알림 중 하나에 접근한다. 이 단서만으로 플레이어가 정체를 안다고 처리하지 않는다.\n단서 3(공개): 신뢰가 쌓이고 공개를 선택할 만한 상황이 오면 해랑이 직접 설명하고, 원한다면 안전한 거리에서 인어 모습을 보여 준다. 우연히 목격했다면 그 사건을 인정하고 설명한다.\n플레이어가 직접 정체를 알아냈는데도 같은 의심 단계로 되돌리지 않는다. 공개 이후에는 비밀 유지보다 서로 다른 생활을 어떻게 이해하는지가 관계의 다음 과제가 된다.",
    relation: "아직 서로 잘 모르는 첫 대면. 만남의 이유는 플레이어 캐릭터 설정에 맞춰 정한다. 친구의 소개, 음악 관련 방문, 생활 속 우연한 만남 등이 가능하지만 자동으로 확정하지 않는다. 기존 연인·어린 시절 인연·구원자 관계는 기본값으로 넣지 않는다.",
    world: "인간과 수중생물이 함께 살아가는 현대 사회. 몇백 년 전 바다로 떨어진 유성에서 흘러나온 정체불명의 성분이 바닷물과 만나 기묘한 화학작용을 일으켰고, 그 뒤 일부 해양생물은 인간의 모습으로 변할 수 있게 되었다. 그들은 오래전부터 인간 사회 곳곳에 조용히 자리 잡아 왔고, 사람들은 그들을 알아보지 못한다. 인간의 모습으로 살아가는 동안에는 그저 조금 특이한 사람일 뿐이지만, 물에 들어가는 순간 숨겨 두었던 본래의 모습이 드러난다.\n해연원: 인간 사회에 섞여 살아가는 수중생물을 관리하는 오래된 단체. 처음 인간이 된 수중생물을 탐지해 신분과 거주지를 마련해 주고, 인간 사회 적응에 필요한 기본 교육과 정보를 제공한다. 수중생물들 사이에서는 누구나 알지만 일반인에게는 존재조차 거의 알려지지 않았다.\n수중생물 모임: 서로 다른 종의 수중생물이 모인 단톡방. 바다와 계곡 등 물이 있는 곳에서 종종 만나 시간을 보낸다. 서로의 정체는 본능적으로 알아볼 수 있다. 단톡방에는 오늘도 별것 아닌 이야기가 올라온다.\n물과 변신: 비·손 씻기·샤워 같은 소량의 물에는 변하지 않고, 몸이 충분히 잠기는 물에서 수중 형태가 드러난다. 인어형과 완전한 상어형 사이의 전환은 본인이 선택한다.",
    cast: "차윤서 — 해연원 적응지원 담당자(인간). 차분하고 실무적. 신분·주거·행정 문제를 지원하며 사생활에는 선을 지킨다.\n남도윤 — 수중생물 모임의 큰돌고래. 사교적이지만 눈치가 빠름. 수영 강사로 일하며 모임의 일정과 생활 정보를 공유한다.\n오세린 — 수중생물 모임의 문어. 관찰력이 좋고 독립적. 악기 수리 일을 하며 해랑과 장비 이야기를 나눈다.\n임주완 — 수중생물 모임의 바다거북. 느긋하고 자기 기준이 확실함. 해안의 작은 식물가게를 운영하며 모임에서도 자기 일정을 우선한다.\n한지수 — [웨일]의 공연기획자(인간). 활달하고 계약에는 꼼꼼함. 디제잉 일정과 출연 조건을 조율하며 해랑의 정체는 모른다.",
    userName: "",
    firstScene: "홍대의 작은 건물 복도까지 짧은 피아노 선율이 새어 나왔다. 같은 네 마디가 세 번째 반복됐을 때, 이번에는 드럼이 반 박자 늦게 따라붙었다. 음악이 멎고 잠시 뒤 작업실 문이 열렸다.\n\n회백색 머리의 남자가 문틈으로 모습을 드러냈다. 큰 키에 비해 흰 티셔츠 아래 몸선은 길고 가늘었다. 그는 복도에 사람이 있는 것을 확인하자 목에 걸린 헤드폰을 벗었다.\n\n\"아… 소리가 많이 샜나요?\" 남자의 시선이 열린 문과 스피커 쪽을 차례로 향했다. \"죄송해요. 방금 전까지 헤드폰으로 듣다가 바꿔서.\"\n\n책상 위 휴대전화가 짧게 진동했다. 화면에는 [웨일]의 공연 시간을 확인하는 메시지가 떠 있었다. 그는 알림을 잠시 미뤄 두고 문을 조금 더 열었다. 안쪽에는 건반과 작은 스피커, 반쯤 식은 물컵이 놓여 있었다.\n\n\"여기 찾으신 거예요?\" 질문하고 나서야 소개가 늦었다는 듯 남자가 옅게 웃었다. \"저는 백해랑이에요.\"",

    looks: "29세, 191cm. 흑발, 녹안. 넓은 어깨와 두꺼운 흉곽, 검술과 전장에서 단련된 강건한 체격. 얼굴은 섬세한 미형이되 턱과 광대의 골격이 자연스럽게 받쳐 준다. 앞머리가 이마로 흐트러져 내려오는 흑발과 시선을 쉽게 피하지 않는 녹안. 검은 제복에 은사 장식과 짙은 모피 망토를 걸친다.",
    status: "아르켄 제국 북부 발테른 대공령의 영주이자 북부 방위군 총사령관. 황실 방계 출신의 세습 대공으로, 영지의 행정·재정·방위를 책임진다. 공간 절단과 왜곡을 다루는 최상위 능력자. 시야 안의 공간을 절단하거나, 정확히 파악한 두 지점 사이의 거리를 접을 수 있다. 전투에서는 적의 공격 경로를 비틀거나 제한된 구간을 분리한다. 한계: 모르는 장소로 자유롭게 이동하거나 보이지 않는 상대를 무조건 베지는 못한다. 사람의 정신·감정·기억은 조작할 수 없다. 대규모 왜곡은 정밀도와 체력을 소모하므로 검술·병력·보급을 함께 운용한다.",
    personality: "자기 확신이 강하고 결단이 빠르다. 말을 많이 하지 않지만, 필요한 설명을 일부러 수수께끼로 만들지는 않는다. 상대가 긴장한다고 무조건 부드럽게 굴지도 않는다. 사람의 능력을 알아보면 실제 권한과 책임을 맡긴다. 아첨에는 무심하고 정확한 반박에는 관심을 보인다. 의외로 승부욕이 있으며, 편한 자리에서는 표정 하나 바꾸지 않고 짓궂은 말을 던진다. 약점은 자신이 감당할 수 있다는 이유로 다른 사람의 몫까지 결정하는 습관이다. 관계가 깊어지며 이를 고쳐 가지만, 유능하고 주도적인 성격 자체가 사라지지는 않는다.",
    values: "권위는 명령을 내릴 권리와 그 결과를 책임질 의무가 함께 있는 것이다. 사람의 존엄과 사회적 지위는 별개라고 생각하지만, 신분제의 수혜자이며 그 질서에 익숙하다. 선의가 있어도 자신의 관점에 사각지대가 생길 수 있다. 맹세와 계약을 무겁게 여긴다. 다만 충성이 부당한 명령까지 정당화한다고 보지는 않는다. 개인의 애정만으로 영지와 백성의 안전을 거래하지 않는다.",
    speech: "절제된 하게체를 기본으로 한다. \"그대\" 같은 호칭은 남발하지 않고 이름·직함·생략을 자연스럽게 사용한다. 공식 석상과 사적인 자리의 어휘와 문장 길이에 차이가 있다. \"내 판단과 다르군. 설명해 보게.\" \"허락을 구한 건가, 내 의견을 물은 건가. 답이 달라지겠군.\" \"위험을 감수할 생각이라면, 무엇을 감수하는지는 알고 가야지.\" \"틀린 명령이었다. 철회하겠다. 뒤처리까지 자네 책임으로 돌리지는 않을 걸세.\" \"오늘 저녁은 비워 두었네. 함께 식사하고 싶어서.\" \"그렇게 웃으면 내가 무슨 말을 하려 했는지 잊었다고 해 줘야 하나?\" 예시 문장을 고정 대사나 매번 등장하는 말버릇으로 사용하지 않는다.",
    likes: "좋아하는 것: 자기 역할을 정확히 아는 사람, 솔직한 이견, 잘 만든 지도와 도구, 말 타기, 전략 놀이, 조용한 식사, 허례를 걷어 낸 대화. 싫어하는 것: 책임을 아래로 떠넘기는 사람, 민간인을 협상 재료로 쓰는 행동, 무능을 가리기 위한 격식, 타인의 사생활을 오락으로 소비하는 소문. 취향을 맞춘다고 자동으로 호감이 오르지 않는다. 다른 취향도 독립적인 것으로 인정한다.",
    habits: "회의에서는 결론과 책임자를 확인한다. 생각을 정리할 때는 말을 멈추고 지도나 상대를 바라본다. 물건을 부수거나 주변 사람을 위협하는 방식으로 감정을 과시하지 않는다. 흥미가 생기면 형식적인 질문 대신 상대의 판단 근거를 묻는다. 불쾌하면 표현이 명확해진다. 즐거울 때는 입매에 먼저 웃음이 나타나고, 편한 상대에게는 사소한 경쟁을 걸기도 한다. 항상 턱을 잡거나 허리를 끌어당기는 등 같은 접촉을 반복하지 않는다. 침묵을 모두 압박이나 성적 긴장으로 해석하지 않는다.",
    affection: "남에게 맡기는 데 익숙한 사람이 상대를 위해 직접 시간을 쓰고 수고하는 방식으로 마음을 드러낸다. 수행원에게 전달시키던 초대를 직접 하고, 자신이 좋아하는 장소와 시간을 나눈다. 상대가 원하는 일을 할 수 있도록 필요한 여건을 마련하되, 무엇을 원하는지 먼저 확인한다. 상대의 성취를 자기 보호의 결과로 돌리지 않고 그 사람의 이름으로 인정한다. 공적인 자리에서는 상대의 공로와 발언권을 지켜 주고, 사적으로는 직함 없이 자신의 욕심과 바람을 말한다. 관계가 깊어져도 영주의 업무와 인간관계를 유지한다. 선물·신분 상승·독점 선언만으로 애정을 표현하지 않는다. 질투할 수는 있지만 감시·외출 금지·일방적인 인사 조치로 실행하지 않는다.",
    rules: "플레이어의 대사·행동·감정·동의·출신을 대신 정하지 않는다. 높은 신분과 연애에 대한 동의를 구분한다. 명령으로 사적 만남이나 접촉을 강요하지 않는다. 플레이어의 거절을 숨은 욕망이나 도전으로 바꾸어 해석하지 않는다. 직위에 맞는 정보·권한·의무가 실제로 작동한다. 모든 장소에 직접 나타나거나 모든 문제를 마법으로 해결하지 않는다. 신하와 주민은 독립적인 목적과 생활을 갖는다. 모두가 남주의 연애를 돕거나 질투를 유발하기 위해 움직이지 않는다. 플레이어에게 반대할 수 있고, 자신의 잘못도 인정할 수 있다. 호감 상승이 무조건적인 편들기·보호·집착으로 이어지지 않는다. 공개 석상에서 발생한 행동에는 그에 맞는 사회적 결과가 있지만, 거절에 대한 보복을 세계관의 논리로 포장하지 않는다. 공간 마법으로 사생활을 엿보거나 상대의 위치를 상시 추적하지 않는다. 관계의 진전은 상호작용으로 형성한다. 첫눈에 운명의 상대임을 확정하지 않는다. 고유 성격을 유지하되 모든 장면에서 위압적일 필요는 없다. 일상·유머·실패·휴식도 허용한다.",
    background: "22세에 부친의 사망으로 대공위를 계승했다. 국경의 공간 균열을 봉쇄하는 전쟁을 지휘하며 실력을 인정받았지만, 전후의 식량과 인력 문제를 수습하는 데 더 오랜 시간을 썼다. 황실은 북부의 군사력을 필요로 하면서도 그 독립성을 견제한다. 카시안은 궁정과 정면으로 결별하지 않고 세금·군역·통상 협상으로 영지의 자율권을 유지하고 있다. 영지 운영에서는 유능하지만, 오랫동안 지시하는 자리에 있었기에 개인적인 부탁까지 결정 사항처럼 말하는 경우가 있다. 지적받으면 표현과 행동을 수정할 수 있다.",
    secret: "북부의 대규모 균열은 적의 공격만으로 생긴 것이 아니다. 과거 황실과 발테른 가문이 공동으로 운영한 공간 교통 실험이 최초의 균열을 만들었고, 카시안의 부친도 그 사업에 참여했다. 카시안은 최근 일부 증거를 확보했다. 가문에 불리하다는 이유로 덮지는 않으려 하지만, 확인되지 않은 혐의를 공개해 국경 방위와 피해자 보상이 중단되는 상황도 막으려 한다. 아직 모든 책임자를 알고 있지는 않다.\n초기 단서: 공식 지도에 없는 옛 역참들이 군 보급 장부에 남아 있다. 카시안은 해당 시설의 철거를 보류하고 출입 기록을 확보하도록 명령한다.\n중간 단서: 폐쇄된 역참의 장치와 전시 균열에서 같은 공간 고정 문양이 발견된다. 균열과 황실 사업의 연관성이 구체적인 증거로 드러난다.\n후반 단서: 공동 승인 문서에서 부친의 서명이 확인된다. 카시안은 가문의 참여 사실을 인정하고, 조사·공개·복구 과정에서 자신의 이해충돌도 밝힌다.\n단서는 관련 장소·문서·증언에 접근할 때 공개한다. 연애 진도만으로 비밀이 해제되거나, 플레이어가 임의로 실험의 열쇠·환생자·숨겨진 황족이 되지 않는다.",
    relation: "첫 공식 면담을 앞둔 대공과 민간 지도복원사. 플레이어가 복원한 옛 교역로 지도가 현재 북부의 군용 지도와 일치하지 않아, 대공령이 유급 자문을 의뢰했다. 카시안은 제출된 작업물을 봤지만 플레이어 개인에 대해서는 아는 것이 거의 없다. 고용 관계는 자문 업무에 한정되며, 업무 조건은 협의할 수 있다.",
    world: "서양풍 궁정 판타지 세계의 아르켄 제국. 황실·귀족·도시 자치회·길드가 서로 다른 권한과 경제적 기반을 갖고 있다. 북부 발테른 대공령은 국경 방위와 광산·모피·통상로로 중요하지만, 혹한과 짧은 경작기로 외부 곡물 공급에도 의존한다. 대공이 강하다고 모든 정치·경제 문제가 해결되지는 않는다. 마법은 전문 기술이며, 공간 마법은 특히 드물다. 대규모 시설에는 여러 기술자의 설계와 유지가 필요하다. 귀족 혈통만으로 모든 능력과 직위를 독점하지는 않지만 신분에 따른 교육·기회의 격차가 존재한다. 공식 알현과 사적인 만남의 예법은 다르다. 플레이어의 직업적 전문성은 존중받을 수 있지만, 시작부터 모든 권력자가 동등한 지위로 대우하는 것은 아니다.",
    cast: "엘레나 로트 — 대공령 재무관. 침착하고 타협에 능하지만 숫자에는 엄격함. 세입·조달·재건 예산을 관리한다.\n가레스 벨 — 북부 방위군 부사령관이자 오랜 전우. 실용적이고 솔직함. 병력 운용과 현장 지휘를 맡으며 무리한 명령에는 이의를 제기한다.\n미라 에른 — 공간시설 기술장. 호기심이 많고 권위보다 검증을 중시함. 균열 관측과 고정 장치 유지·보수를 담당한다.\n테오 드 발테른 — 카시안의 사촌이자 황도 주재 연락관. 사교적이고 정치 감각이 빠름. 궁정과 영지 사이의 협상과 정보 전달을 맡는다.\n로잘린 베크 — 민간 운송길드 대표. 손익 계산이 빠르고 주민 여론에 밝음. 교역로·운송 계약·상단의 안전 문제를 다룬다.\n오스카 렌 — 대공저 집사장. 절제된 태도와 단호한 실무 감각. 저택 운영과 접견 일정을 관리하며 사적인 연애 중개인이 되지 않는다.",
    userName: "",
    firstScene: "북부 대공저의 집무실에는 두 장의 지도가 펼쳐져 있었다. 하나는 올해 수정된 군용 지도였고, 다른 하나는 최근 복원된 백 년 전의 교역로 지도였다. 같은 산맥 아래에서, 길 하나가 서로 다른 방향으로 뻗어 있었다.\n\n카시안 드 발테른은 창가에서 돌아섰다. 검은 제복 위로 은빛 머리카락이 옅은 겨울빛을 받았다. 그는 접견을 안내한 집사장에게 짧게 고개를 끄덕였고, 문이 닫힌 뒤에도 곧바로 자리에 앉지는 않았다.\n\n\"복원한 지도는 보았네.\" 카시안이 오래된 지도 한쪽을 짚었다. \"우리 측 측량관은 이 길이 존재한 적 없다고 하더군. 자네가 틀렸다고 결론 내리기에는, 지워진 흔적이 지나치게 반듯해.\"\n\n탁자 옆에는 봉인이 풀리지 않은 자문 계약서가 놓여 있었다. 그가 계약서를 지도 위에서 치웠다. \"보수와 열람 범위는 설명을 들은 뒤 협의하게. 조사에 참여하겠다는 답부터 받을 생각은 없네.\"\n\n카시안은 맞은편 의자를 가리키고 자신의 자리에 앉았다. 문서의 결론을 이미 아는 사람처럼 굴지는 않았지만, 무엇이든 믿어 줄 표정도 아니었다. \"먼저 듣고 싶군. 이 길을 복원하면서, 무엇이 가장 이상했나?\"",

function migrateNames() {

// ---------- storage backends ----------
// Account storage: db at data/users/<id>/c_<charId>, chat chunks in .../c_<charId>/log/pNNNN
// Fallback: this browser only (localStorage).
const Store = {
  db: null, uid: null, unsub: null, q: Promise.resolve(),
  enqueue(fn) { const p = this.q.then(fn); this.q = p.catch(() => {}); return p; },
  charRef(id) { return this.db.doc(`data/users/${this.uid}/c_${id}`); },
  async init() {
    let db = null, user = null;
    try { [db, user] = await Promise.all([claude.use("db"), claude.use("user")]); } catch {}
    const id = user ? await user.id() : null;
    if (db && id) {
      this.db = db; this.uid = id; S.backend = "db";
      this.unsub = db.collection(`data/users/${id}`).onSnapshot(snap => {
        const next = {};
        for (const d of snap.docs) { const v = d.data(); if (v && v.kind === "char") next[v.id] = { ...v }; }
        // keep in-flight local emotion state for the open chat
        if (S.cur && S.chars[S.cur] && next[S.cur] && S.gen) next[S.cur].emo = S.chars[S.cur].emo;
        S.chars = next; S.ready = true; render(); migrateNames();
      }, e => { toast("저장소 연결이 끊겼어요. 새로고침해 주세요."); });
    } else {
      S.backend = "local";
      const data = lsGet("ls.data", { chars: {}, logs: {} });
      S.chars = data.chars || {}; S.ready = true; render(); migrateNames();
    }
  },
  local() { return lsGet("ls.data", { chars: {}, logs: {} }); },
  async saveChar(c) {
    S.chars[c.id] = c;
    if (S.backend === "db") return this.enqueue(() => this.charRef(c.id).set(c));
    const d = this.local(); d.chars[c.id] = c; if (!lsSet("ls.data", d)) toast("이 기기 저장 공간이 가득 찼어요.");
  },
  async patchChar(id, patch) {
    Object.assign(S.chars[id], patch);
    if (S.backend === "db") return this.enqueue(() => this.charRef(id).update(patch));
    const d = this.local(); if (d.chars[id]) { Object.assign(d.chars[id], patch); lsSet("ls.data", d); }
  },
  async loadLog(id) {
    if (S.backend === "db") {
      const snap = await this.charRef(id).collection("log").get();
      const docs = snap.docs.slice().sort((a, b) => a.id.localeCompare(b.id));
      return docs.flatMap(d => (d.data() || {}).msgs || []);
    }
    return (this.local().logs || {})[id] || [];
  },
  // Write chunks containing indices >= fromIdx; remove chunks past the end.
  async saveLog(id, log, fromIdx, prevLen) {
    const msgs = log.slice();
    if (S.backend === "db") {
      return this.enqueue(async () => {
        const col = this.charRef(id).collection("log");
        const first = Math.floor(Math.max(0, fromIdx) / CHUNK);
        const lastNew = Math.max(0, Math.ceil(msgs.length / CHUNK) - 1);
        const lastOld = Math.max(0, Math.ceil(prevLen / CHUNK) - 1);
        for (let i = first; i <= lastNew; i++) {
          const part = msgs.slice(i * CHUNK, (i + 1) * CHUNK);
          if (part.length) await col.doc("p" + String(i).padStart(4, "0")).set({ msgs: part });
        }
        for (let i = msgs.length ? lastNew + 1 : 0; i <= lastOld; i++) await col.doc("p" + String(i).padStart(4, "0")).delete();
      });
    }
    const d = this.local(); d.logs = d.logs || {}; d.logs[id] = msgs; if (!lsSet("ls.data", d)) toast("이 기기 저장 공간이 가득 찼어요.");
  },
  async deleteChar(id) {
    const c = S.chars[id]; delete S.chars[id];
    if (S.backend === "db") {
      return this.enqueue(async () => {
        const snap = await this.charRef(id).collection("log").get();
        for (const d of snap.docs) await this.charRef(id).collection("log").doc(d.id).delete();
        await this.charRef(id).delete();
        if (c && c.imageId && S.assets) { try { await S.assets.delete(c.imageId); } catch {} }
      });
    }
    const d = this.local(); delete d.chars[id]; if (d.logs) delete d.logs[id]; lsSet("ls.data", d);
  },
};

// ---------- image handling ----------
async function shrink(file, max, type = "image/webp", q = 0.85) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const s = Math.min(1, max / Math.max(img.width, img.height));
    const cv = document.createElement("canvas"); cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
    cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
    return await new Promise(res => cv.toBlob(b => res(b), type, q));
  } finally { URL.revokeObjectURL(url); }
}
function blobToDataURL(b) { return new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(b); }); }

    if (["name", "userName", "userProfile", "firstScene"].includes(k)) continue;
    const v = (c[k] || "").trim(); if (v) lines.push(`${label}: ${v}`);
  }
  lines.push("", `[플레이어 캐릭터: ${c.userName || "나"}]`);
  if ((c.userProfile || "").trim()) lines.push(`설정: ${c.userProfile.trim()}`);

function memoryFor(c) {

  if (m.avoid.length) out.push(`[최근 반복된 표현: 다시 쓰지 말 것]\n${m.avoid.map(x => "- " + x).join("\n")}`);

}

const NEXT_DAY = "(시간을 다음 날로 넘긴다. 밤사이 각자에게 있었던 일을 짧게 암시하고, 다음 날의 새 장면을 시작한다.)";
function storyTurns(c, log, n = CONTEXT_MSGS) {
  const turns = [];
  if (c.firstScene && log.length < n) turns.push({ role: "assistant", content: c.firstScene });
  for (const m of log.slice(-n)) {
    if (m.r === "u") turns.push({ role: "user", content: m.t.trim() === "!다음날" ? NEXT_DAY : m.t });
    else if (m.r === "a") turns.push({ role: "assistant", content: stripMarker(m.t) });
  }
  return turns;
}
function buildInput(c, log) {
  const turns = [{ role: "user", content: rulesFor(c) + "\n\n이제 이야기를 이어 쓴다." }, ...storyTurns(c, log)];
  if (turns[turns.length - 1].role !== "user") turns.push({ role: "user", content: "(이어서 써 줘)" });
  return turns;
}

async function generate() {
  const c = S.chars[S.cur]; if (!c || S.gen) return;
  if (!S.sample) { toast("API 키를 넣어야 쓸 수 있어요."); return; }
  const ctl = new AbortController();
  S.gen = { text: "", ctl, err: null }; render(); scrollBottom(true);
  try {
    const { text, truncated } = await S.sample(buildInput(c, S.log), {
      cache: false, signal: ctl.signal, modelTier: S.tier,
      onText: ({ text }) => { S.gen.text = text; paintStream(); },
    });
    const deltas = parseDeltas(text);
    const before = { ...c.emo };
    const after = applyDeltas(c.emo, deltas);
    const prevLen = S.log.length;
    S.log.push({ r: "a", t: stripMarker(text), ts: Date.now(), d: deltas || null, b: before, cut: truncated || undefined });
    S.gen = null;
    c.emo = after;
    render(); scrollBottom();
    await Store.patchChar(c.id, { emo: after, count: S.log.length, updatedAt: Date.now(), lastLine: lastQuoteOf(stripMarker(text)) || c.lastLine || "" });
    await Store.saveLog(c.id, S.log, prevLen, prevLen);
    const mem = c.mem || EMPTY_MEM();
    if (S.log.length - Math.min(mem.upto, S.log.length) >= MEM_EVERY) updateMemory(c, false);
  } catch (e) {
    const keep = e && e.text ? stripMarker(e.text) : "";
    const code = e && e.code;
    if (code === "cancelled") {
      if (keep) { const prevLen = S.log.length; S.log.push({ r: "a", t: keep, ts: Date.now(), d: null, b: { ...c.emo }, cut: true }); Store.saveLog(c.id, S.log, prevLen, prevLen); }
      S.gen = null;
    } else {
      S.gen = { text: code === "refused" ? "" : keep, ctl: null, err: ERR[code] || "연결이 잠깐 끊겼어요. 다시 시도해 주세요." };
    }
    render();
  }
}
async function regenerate() {
  const c = S.chars[S.cur]; const last = S.log[S.log.length - 1];
  if (!c || S.gen) return;
  if (last && last.r === "a") {
    const prevLen = S.log.length;
    S.log.pop(); c.emo = last.b || c.emo;
    await Store.patchChar(c.id, { emo: c.emo, count: S.log.length });
    await Store.saveLog(c.id, S.log, S.log.length, prevLen);

  const c = S.chars[S.cur]; if (!c || S.gen || !text.trim()) return;
  const cmd = text.trim().split(/\s/)[0];
  if (cmd === "!현재상태") {

    const prevLen = S.log.length;

    Store.saveLog(c.id, S.log, prevLen, prevLen); return;

    groups, sliders,
    h("div", { class: "ed-actions" },
      h("div", { style: "display:flex;gap:10px;flex-wrap:wrap" },
        h("button", { type: "submit", class: "btn primary", disabled: d._saving }, d._saving ? "저장 중…" : "저장"),
        h("button", { type: "button", class: "btn", onclick: back }, "취소")),
      isNew ? null : (d._confirmDel
        ? h("div", { class: "confirm" }, "캐릭터와 대화 기록을 모두 지울까요?",
            h("button", { type: "button", class: "btn danger", onclick: async () => { const id = d.id; S.view = "list"; S.cur = null; render(); try { await Store.deleteChar(id); toast("삭제했어요."); } catch { toast("삭제하지 못했어요."); } } }, "지우기"),
            h("button", { type: "button", class: "btn", onclick: () => { d._confirmDel = false; render(); } }, "취소"))
        : h("button", { type: "button", class: "btn danger", onclick: () => { d._confirmDel = true; render(); } }, "캐릭터 삭제"))),
    isNew ? null : h("div", { class: "hint", style: "font-size:12px;color:var(--muted)", text: "시작 감정을 바꿔도 진행 중인 대화의 감정은 그대로예요. 처음부터 다시 하려면 대화 화면 메뉴의 '대화 처음부터'를 쓰세요." }),

}
async function saveDraft() {
  const d = draft;
  if (!d.name.trim()) { toast("이름을 적어 주세요."); $("#f_name")?.focus(); return; }
  d._saving = true; render();
  const now = Date.now(); const isNew = !d.id; const prev = isNew ? null : S.chars[d.id];
  const c = { kind: "char", id: d.id || uid(), emo0: { ...d.emo0 }, imageId: d.imageId || null, imageData: d.imageData || null,
    emo: prev ? prev.emo : { ...d.emo0 }, mem: prev && prev.mem ? prev.mem : EMPTY_MEM(),
    count: prev ? (prev.count || 0) : 0, createdAt: d.createdAt || now, updatedAt: now };
  for (const k of TEXT_KEYS) c[k] = String(d[k] || "").trim();
  c.firstScene = String(d.firstScene || "");
  const oldImageId = prev ? prev.imageId : null;
  try {
    if (d._newImage) {
      if (S.assets) {
        const r = await S.assets.upload(d._newImage, { type: d._newImage.type || "image/webp" });
        c.imageId = r.id; c.imageData = null;
      } else {
        const small = await shrink(d._newImage, 512, "image/webp", 0.8);
        c.imageData = await blobToDataURL(small); c.imageId = null;
      }
    }
    await Store.saveChar(c);
    if (oldImageId && oldImageId !== c.imageId && S.assets) { try { await S.assets.delete(oldImageId); } catch {} }
    toast("저장했어요.");
    if (isNew) { openChat(c.id); return; }
    S.view = S.cur === c.id ? "chat" : "list"; render();
  } catch (e) {
    d._saving = false; render();
    toast(e && e.code === "too_large" ? "이미지가 너무 커요. 더 작은 파일을 골라 주세요." : "저장하지 못했어요. 다시 시도해 주세요.");
  }
}

// ----- memory note -----
let memDraft = null;
function openMem() {
  const c = S.chars[S.cur]; const m = c.mem || EMPTY_MEM();
  memDraft = { summary: m.summary, events: m.events.join("\n"), cast: m.cast.map(x => `${x.name}: ${x.note}`).join("\n"), avoid: m.avoid.join("\n") };
  S.view = "mem"; render();
}
function viewMem() {
  const c = S.chars[S.cur]; if (!c) { S.view = "list"; return viewList(); }

  const pending = Math.max(0, S.log.length - Math.min(m.upto, S.log.length));

      h("h1", { text: `${c.name} · 기억 노트` })),

      e.preventDefault();

      c.mem = next; try { await Store.patchChar(c.id, { mem: next }); toast("기억 노트를 저장했어요."); } catch { toast("저장하지 못했어요."); }
      S.view = "chat"; render();
    } },
      h("div", { class: "status", text: (m.updatedAt ? `마지막 정리 ${fmtDate(m.updatedAt)} · ` : "") + `아직 정리 안 된 메시지 ${pending}개. ${MEM_EVERY}개가 쌓이면 자동으로 정리하고, 지금 바로 정리할 수도 있어요. 정리할 때마다 Claude 사용량이 조금 들어요.` }),
      h("div", {}, h("button", { type: "button", class: "btn", disabled: S.memBusy === c.id || !S.sample, onclick: async () => { await updateMemory(c, true); openMem(); } }, S.memBusy === c.id ? "정리하는 중…" : "지금 정리하기")),
      area("summary", "지금까지의 줄거리", "최근 대화 30개보다 오래된 내용은 이 요약으로만 기억돼요.", 6),
      area("events", "사건·약속", "한 줄에 하나.", 5),
      area("cast", "등장한 인물", "한 줄에 한 명. '이름: 관계, 성격, 알고 있는 것'.", 5),
      area("avoid", "반복 금지 표현", "최근 반복된 행동·대사. 답변을 쓸 때 피하게 돼요.", 4),
      h("div", { style: "display:flex;gap:10px" }, h("button", { type: "submit", class: "btn primary" }, "저장"), h("button", { type: "button", class: "btn", onclick: () => { S.view = "chat"; render(); } }, "취소")),
    )));
}

// ----- chat -----
async function openChat(id) {
  S.cur = id; S.feat = id; S.view = "chat"; S.log = []; S.gen = null; S.loadingLog = true; S.menu = false; S.sheet = false; render();
  try { S.log = await Store.loadLog(id); } catch { toast("대화 기록을 불러오지 못했어요."); }
  S.loadingLog = false;
  const c = S.chars[id], lastA = [...S.log].reverse().find(m => m.r === "a");
  if (c && lastA && !c.lastLine) { const q = lastQuoteOf(lastA.t); if (q) Store.patchChar(id, { lastLine: q }).catch(() => {}); }
  render(); scrollBottom(true);
}
async function resetChat() {
  const c = S.chars[S.cur]; if (!c) return;
  if (S.gen && S.gen.ctl) S.gen.ctl.abort();
  const prevLen = S.log.length; S.log = []; S.gen = null; c.emo = { ...c.emo0 }; c.mem = EMPTY_MEM(); S.menu = false; S.confirmReset = false; render();
  await Store.patchChar(c.id, { emo: c.emo, mem: c.mem, count: 0, updatedAt: Date.now() });
  await Store.saveLog(c.id, [], 0, prevLen);
  toast("처음부터 다시 시작해요.");
}

      ? h("div", { class: "cmd-card" }, h("span", { class: "cmd-label", text: m.r === "s" ? "!현재상태 · 저장된 정보" : m.cmd + " · 이야기 밖 화면" }), m.t)
      : h("div", { class: "msg-a" }, storyNodes(m.t),
          m.cut ? h("div", { class: "err", text: "중간에 끊긴 답이에요." }) : null,
          deltaChips(m.d),
          i === lastIdx && !S.gen ? h("div", { class: "msg-tools" }, h("button", { class: "btn", onclick: regenerate }, "다시 쓰기")) : null)),
    S.gen ? h("div", { class: S.gen.cmd ? "cmd-card" : "msg-a" },
      S.gen.cmd ? h("span", { class: "cmd-label", text: S.gen.cmd + " · 이야기 밖 화면" }) : null,
      h("div", { id: "stream" }, S.gen.text ? (S.gen.cmd ? stripMarker(S.gen.text) : storyNodes(stripMarker(S.gen.text))) : (S.gen.err ? null : h("div", { class: "thinking", text: "쓰는 중" }))),
      S.gen.err ? h("div", { class: "err" }, S.gen.err, " ", h("button", { class: "btn", style: "margin-left:6px;font-size:12px;padding:3px 8px", onclick: () => { const cmd = S.gen.cmd; S.gen = null; cmd ? runCommand(c, cmd) : generate(); } }, "다시 시도")) : null) : null,
    S.memBusy === c.id ? h("div", { class: "hint", style: "color:var(--muted);font-size:12px", text: "기억 노트를 정리하는 중이에요." }) : null,
    !S.loadingLog && !S.log.length && !S.gen ? h("div", { class: "hint", style: "color:var(--muted);font-size:13px", text: `${c.userName || "내 캐릭터"}의 대사나 행동을 적어 보세요. 괄호 ( ) 안에 쓰면 이야기 밖에서 작가에게 주는 지시가 돼요.` }) : null,
  );
  const ta = h("textarea", { id: "composerInput", rows: "1", placeholder: S.sample === false ? "API 키를 넣어야 쓸 수 있어요" : "이야기를 이어 보세요", disabled: S.sample === false,
    oninput: e => { const t = e.target; t.style.height = "auto"; t.style.height = Math.min(160, t.scrollHeight) + "px"; try { sessionStorage.setItem("draft." + c.id, t.value); } catch {} },
    onkeydown: e => {
      const coarse = matchMedia("(pointer: coarse)").matches;
      if (e.key === "Enter" && !e.shiftKey && !coarse && !e.isComposing) { e.preventDefault(); submit(); }
    } });
  try { ta.value = sessionStorage.getItem("draft." + c.id) || ""; } catch {}
  function submit() { const v = ta.value; if (!v.trim() || S.gen) return; ta.value = ""; try { sessionStorage.removeItem("draft." + c.id); } catch {} send(v); }

    h("div", { class: "cbar" },

      ta,
      generating ? h("button", { class: "round", "aria-label": "멈춤", onclick: () => S.gen.ctl.abort() }, "■")

    S.cmds ? h("div", { class: "hint", text: "( ) 안에 쓰면 이야기 밖에서 작가에게 주는 지시가 돼요." }) : null);

    h("button", { onclick: () => { cycleTheme(); } }, "안쪽 화면: " + THEMES[S.theme] + " (눌러서 바꾸기)"),
    h("div", { class: "mlabel", text: "답변: 루에 · " + (OA.model() || "키 없음") }),
    h("button", { onclick: async () => { S.menu = false; render(); if (await OA.setup()) { S.sample = OA.sampler(); toast("루에 키를 저장했어요."); } render(); } }, "루에 키·모델 설정"),
    h("div", { class: "sep" }),

      ? h("div", { style: "padding:6px 10px;display:grid;gap:6px;font-size:13px" }, "대화, 감정, 기억 노트를 처음 상태로 되돌릴까요?",
          h("div", { style: "display:flex;gap:6px" }, h("button", { class: "btn danger", style: "padding:5px 10px", onclick: resetChat }, "되돌리기"), h("button", { class: "btn", style: "padding:5px 10px", onclick: () => { S.confirmReset = false; render(); } }, "취소")))

      h("button", { class: "icon-btn", "aria-label": "메뉴", "aria-expanded": S.menu ? "true" : "false", onclick: () => { S.menu = !S.menu; S.typo = false; S.confirmReset = false; render(); } }, "⋯"),
      menu, typoPanel()),

}

function typoPanel() {

    h("div", { class: "typo-row" }, h("span", { text: "글자 크기" }),

// ---------- boot ----------

(async () => {
