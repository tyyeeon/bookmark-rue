<style>

.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;padding:0 max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left));pointer-events:none}

/* 데이터: data.json(관제탑이 고침) + 이 기기에서 바꾼 내용(체크·추가·상태) */
const OVKEY='luminode-hub-overlay-v1',SEEN='luminode-hub-seen-v1';
let data=[],loaded=false,failed=false,filter='전체',seg='projects',tab='할 일',open=new Set(),addOpen=new Set(),resetArmed=false;
let shown=new Date(),selDate=iso(shown.getFullYear(),shown.getMonth()+1,shown.getDate());
const lines=v=>String(v||'').split('\n').map(x=>x.replace(/^\s*[·•]\s*/,'').trim()).filter(Boolean);
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
function build(rows){
 let ov={done:{},extra:{},status:{}};
 try{const r=JSON.parse(lsGet(OVKEY));if(r&&typeof r==='object')ov={done:r.done||{},extra:r.extra||{},status:r.status||{}}}catch(e){}
 const order=['plan','ai','app'];
 rows=rows.slice().sort((a,b)=>{const i=order.indexOf(a.id),j=order.indexOf(b.id);return (i<0?99:i)-(j<0?99:j)});
 data=rows.map(p=>{
  const mk=(k,src)=>lines(src).map(t=>({t,done:!!ov.done[p.id+'|'+k+'|'+t]})).concat((ov.extra[p.id+'|'+k]||[]).map(x=>({t:x.t,done:!!x.done,extra:true})));
  return{id:p.id,name:p.name||p.id,scope:p.scope||'',base:p.status||'대기',status:ov.status[p.id]||p.status||'대기',updated:p.updated||'',by:p.by||'',tasks:mk('tasks',p.next),threads:mk('threads',p.note)};
 });
}
function save(){
 const ov={done:{},extra:{},status:{}};
 for(const p of data){
  if(p.status!==p.base)ov.status[p.id]=p.status;
  for(const k of ['tasks','threads'])for(const x of p[k]){
   if(x.extra)(ov.extra[p.id+'|'+k]=ov.extra[p.id+'|'+k]||[]).push({t:x.t,done:x.done});
   else if(x.done)ov.done[p.id+'|'+k+'|'+x.t]=1;
  }
 }
 lsSet(OVKEY,JSON.stringify(ov));
}

/* 라우팅 */
function navHtml(r){
 const items=[['home','홈',I.home,'#/'],['cal','일정',I.cal,'#/cal'],['projects','프로젝트',I.folder,'#/projects'],['todo','할 일',I.todo,'#/todo'],['more','더보기',I.more,'#/more']];
 return items.map(i=>'<button data-go="'+i[3]+'" class="'+(r===i[0]?'on':'')+'">'+i[2]+'<span>'+i[1]+'</span></button>').join('');
}
function render(){
 const h=location.hash.replace(/^#\/?/,'');
 const splashEl=$('#splash'),appEl=$('#app'),navw=$('#navwrap');
 if(h==='splash'||(!lsGet(SEEN)&&h==='')){splashEl.innerHTML=viewSplash();splashEl.hidden=false;appEl.hidden=true;navw.hidden=true;return}
 splashEl.hidden=true;appEl.hidden=false;navw.hidden=false;
 let r='home',html='';expandAll=(h==='projects');
 if(h.startsWith('p/')){r='projects';html=viewDetail(decodeURIComponent(h.slice(2)))}
 else if(h==='cal'){r='cal';seg='cal';html=viewHub(false)}
 else if(h==='projects'){r='projects';seg='projects';html=viewHub(true)}
 else if(h==='todo'){r='todo';html=viewTodo()}
 else if(h==='more'){r='more';html=viewMore()}
 else{r='home';seg='projects';html=viewHub(false)}
 $('#view').innerHTML=html;$('#nav').innerHTML=navHtml(r);
}
const keepScroll=fn=>{const y=window.scrollY;fn();window.scrollTo(0,y)};
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-refresh],[data-soon],[data-addtoggle],[data-go],[data-check],[data-toggle],[data-filter],[data-seg],[data-tab],[data-date],[data-month],[data-start],[data-reset],[data-splash]');
 if(!t)return;
 if(t.hasAttribute('data-refresh')){toast('새로 불러오는 중…');setTimeout(()=>{location.href=location.pathname+'?v='+Date.now()+(location.hash||'')},250);return}
 if(t.dataset.soon){toast(t.dataset.soon+' 기능은 아직 없어요.');return}
 if(t.dataset.addtoggle){const k=t.dataset.addtoggle;addOpen.has(k)?addOpen.delete(k):addOpen.add(k);keepScroll(render);return}
 if(t.dataset.go){location.hash=t.dataset.go;window.scrollTo(0,0);return}
 if(t.hasAttribute('data-start')){lsSet(SEEN,'1');location.hash='#/';return}
 if(t.hasAttribute('data-splash')){location.hash='#/splash';return}
 if(t.hasAttribute('data-reset')){if(!resetArmed){resetArmed=true;keepScroll(render);return}lsDel(OVKEY);resetArmed=false;build(rawRows);keepScroll(render);toast('이 기기에서 바꾼 내용을 지웠어요.');return}
 if(t.dataset.check){const[id,k,i]=t.dataset.check.split('|');const p=data.find(x=>x.id===id);p[k][+i].done=!p[k][+i].done;save();keepScroll(render);return}
 if(t.dataset.toggle){const k=t.dataset.toggle,S=expandAll?closed:open;S.has(k)?S.delete(k):S.add(k);keepScroll(render);return}
 if(t.dataset.filter){filter=t.dataset.filter;keepScroll(render);return}
 if(t.dataset.seg){seg=t.dataset.seg;location.hash=seg==='cal'?'#/cal':'#/';return}
 if(t.dataset.tab){tab=t.dataset.tab;keepScroll(render);return}
 if(t.dataset.date){selDate=t.dataset.date;keepScroll(render);return}
 if(t.dataset.month!=null){const d=Number(t.dataset.month);if(d===0)shown=new Date();else shown=new Date(shown.getFullYear(),shown.getMonth()+d,1);selDate=iso(shown.getFullYear(),shown.getMonth()+1,d===0?shown.getDate():1);keepScroll(render)}
});
document.addEventListener('submit',e=>{
 const f=e.target.closest('[data-add]');if(!f)return;e.preventDefault();
 const[id,k]=f.dataset.add.split('|'),v=f.querySelector('input').value.trim();if(!v)return;
 data.find(x=>x.id===id)[k].push({t:v,done:false,extra:true});save();keepScroll(render);toast('항목을 추가했어요 (이 기기에만 저장)');
});
document.addEventListener('change',e=>{
 const s=e.target.closest('[data-status]');if(!s)return;
 data.find(x=>x.id===s.dataset.status).status=s.value;save();keepScroll(render);toast('상태를 '+s.value+'로 바꿨어요 (이 기기에만 저장)');
});
window.addEventListener('hashchange',()=>{tab=(location.hash.startsWith('#/p/')?tab:'할 일');render()});
let rawRows=[];
render();
(async()=>{
 try{const r=await fetch('data.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error(r.status);const j=await r.json();rawRows=j.projects||[];build(rawRows)}catch(e){failed=true}
 loaded=true;render();
})();
})();
</script>
</body></html>
