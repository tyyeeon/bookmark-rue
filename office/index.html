<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f7f9">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="관제탑">

<link rel="stylesheet" href="gyuyeon.css?v=furniture-final-1"></head><body>
<title>관제탑</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  :root {
    --bg: #f4f7f9; --panel: #fcfdfe; --line: #e1e8ed; --text: #1f2430; --muted: #7a8193;
    --accent: #d97757; --green: #22a35a; --blue: #3b6fd8; --amber: #d89a1e;
    --card: #ffffff; --card-line: #d6e0e7; --stage: #eaf2f7;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #16181d; --panel: #1e2128; --line: #2e323b; --text: #e8eaf0; --muted: #9298a8; --card: #262a33; --card-line: #3a3f4a; --stage: #111317; color-scheme: dark } }
  :root[data-theme="dark"] { --bg: #16181d; --panel: #1e2128; --line: #2e323b; --text: #e8eaf0; --muted: #9298a8; --card: #262a33; --card-line: #3a3f4a; --stage: #111317; color-scheme: dark }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  main { background: var(--stage); }
  body { background: var(--bg); color: var(--text); font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif; overflow: hidden; }
  .app { display: grid; grid-template-columns: 210px 1fr 260px; height: 100vh; }
  .app.wide { grid-template-columns: 1fr; }
  .app.wide aside { display: none; }
  aside { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 14px 12px; }
  aside.right { border-right: 0; border-left: 1px solid var(--line); }
  h2 { font-size: 13px; margin: 0 0 10px; display: flex; justify-content: space-between; align-items: center; }
  h2 small { color: var(--muted); font-weight: 400; font-size: 11px; }
  .card { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 12px; background: var(--panel); }

  .floor { display: flex; gap: 10px; align-items: center; padding: 9px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; cursor: pointer; background: var(--panel); }
  .floor:hover { border-color: #cfd4dc; }
  .floor.on { border: 2px solid #67C8F2; padding: 8px; background: #67C8F21c; }
  .floor .badge { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; font-weight: 700; color: #fff; flex: none; }
  .floor .meta { flex: 1; min-width: 0; }
  .floor b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .floor span { color: var(--muted); font-size: 11px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #c8ccd4; flex: none; }
  .dot.live { background: var(--green); box-shadow: 0 0 0 3px #22a35a22; }

  main { position: relative; overflow: hidden; cursor: grab; }
  main.drag { cursor: grabbing; }
  .topbar { position: absolute; left: 14px; top: 12px; right: 14px; display: flex; justify-content: space-between; pointer-events: none; z-index: 5; }
  .pill { pointer-events: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 7px 12px; display: flex; gap: 9px; align-items: center; box-shadow: 0 2px 8px #0000000d; }
  .projbar { position: absolute; left: 14px; right: 14px; top: 54px; display: flex; gap: 6px; overflow-x: auto; z-index: 5; scrollbar-width: none; padding-bottom: 2px; }
  .projbar::-webkit-scrollbar { display: none; }
  .pj { flex: none; display: flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; font: inherit; font-size: 12px; color: var(--text); cursor: pointer; white-space: nowrap; max-width: 180px; }
  .pj span { overflow: hidden; text-overflow: ellipsis; }
  .pj.on { border: 2px solid #67C8F2; padding: 4px 10px; background: #e9f6fd; }
  .pj i { width: 8px; height: 8px; border-radius: 50%; flex: none; background: #b8bec7; }
  .pj i.stuck { background: #E5534B; } .pj i.go { background: #3FB37F; }
  .av.dim { opacity: .15 !important; pointer-events: none; }
  .pill .fl { background: var(--text); color: var(--panel); border-radius: 6px; padding: 1px 6px; font-weight: 700; font-size: 11px; }
  .live-pill { font-weight: 700; font-size: 11px; color: var(--green); }
  .live-pill.off { color: var(--muted); }
  .zoom { position: absolute; left: 14px; bottom: 14px; z-index: 5; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .zoom button { border: 0; background: var(--panel); color: var(--text); width: 34px; height: 32px; font-size: 16px; cursor: pointer; }
  .zoom button + button { border-top: 1px solid var(--line); }
  .hint { position: absolute; right: 14px; bottom: 10px; color: var(--muted); font-size: 11px; z-index: 5; }

  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #world svg { position: absolute; left: 0; top: 0; overflow: visible; }
  .room-label { font-size: 11.5px; font-weight: 700; fill: #5b6870; letter-spacing: .5px; }
  .floor-label { font-size: 26px; font-weight: 800; fill: #35424B; }
  .floor-sub { font-size: 13px; font-weight: 600; fill: #7f8d96; letter-spacing: 1px; }

  .av { position: absolute; transform: translate(-50%, -100%) scale(1.35); transform-origin: 50% 100%; transition: left 1.4s cubic-bezier(.4,.1,.2,1), top 1.4s cubic-bezier(.4,.1,.2,1); display: flex; flex-direction: column; align-items: center; pointer-events: auto; cursor: pointer; }
  .av .bubble { max-width: 160px; background: var(--card); color: var(--text); border: 1px solid var(--card-line); border-radius: 10px; padding: 5px 9px; font-size: 11px; line-height: 1.35; box-shadow: 0 2px 6px #0000001a; margin-bottom: 6px; position: relative; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .av .bubble::after { content: ""; position: absolute; left: 50%; bottom: -5px; width: 8px; height: 8px; background: var(--card); border-right: 1px solid var(--card-line); border-bottom: 1px solid var(--card-line); transform: translateX(-50%) rotate(45deg); }
  .av .person { position: relative; width: 26px; height: 38px; }
  .av .head { position: absolute; left: 5px; top: 0; width: 16px; height: 16px; border-radius: 50%; background: #f2d3b8; border: 2px solid #3a2a22; border-bottom-color: #f2d3b8; }
  .av .body { position: absolute; left: 2px; top: 15px; width: 22px; height: 20px; border-radius: 9px 9px 5px 5px; }
  .av .shadow { position: absolute; left: 1px; bottom: -3px; width: 24px; height: 8px; border-radius: 50%; background: #00000022; }
  .av .tag { margin-top: 4px; background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 7px; padding: 1px 7px; font-size: 10.5px; white-space: nowrap; max-width: 170px; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 5px; align-items: center; }
  .av .sprite { display: none; height: 68px; filter: drop-shadow(0 2px 2px #0000001f); }
  .av.eum .sprite, .av.rue .sprite { display: block; }
  .av.eum .person, .av.rue .person { display: none; }
  .av.rue .sprite { height: 52px; }
  .av.working .person, .av.working .sprite { animation: bob .9s ease-in-out infinite; }
  .av.idle { opacity: .8; }
  .av.idle .bubble, .av.idle .tag { display: none; }
  .av.idle:hover .tag, .av.idle.sel .tag { display: flex; }
  .av.sel .tag { border-color: var(--accent); box-shadow: 0 0 0 2px #d9775733; }
  @keyframes bob { 50% { transform: translateY(-2px); } }

  .person-row { display: flex; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); cursor: pointer; }
  .person-row:first-of-type { border-top: 0; }
  .ava { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; flex: none; font-size: 12px; }
  .person-row .meta { flex: 1; min-width: 0; }
  .person-row b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .person-row .sub { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip { font-size: 10px; border-radius: 6px; padding: 1px 6px; font-weight: 600; white-space: nowrap; height: fit-content; }
  .chip.working { background: #e6efff; color: var(--blue); }
  .chip.thinking { background: #f1ebff; color: #7a4fd0; }
  .chip.waiting { background: #e8f6ee; color: var(--green); }
  .chip.idle { background: #f0f1f4; color: var(--muted); }
  .log { list-style: none; margin: 0; padding: 0; max-height: 260px; overflow-y: auto; }
  .log li { display: grid; grid-template-columns: 56px 1fr; gap: 6px; padding: 5px 0; border-top: 1px dashed var(--line); font-size: 11.5px; }
  .log li:first-child { border-top: 0; }
  .log time { color: var(--muted); font-size: 10.5px; }
  .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; font-size: 11.5px; }
  .legend div { display: flex; gap: 6px; align-items: baseline; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; flex: none; transform: translateY(1px); }
  .empty { color: var(--muted); font-size: 12px; padding: 8px 0; }
  .muted { color: var(--muted); }

  @media (max-width: 900px) {
    body { overflow: auto; }
    .app { grid-template-columns: 1fr; grid-template-rows: auto auto auto; height: auto; }
    #title, .hint { display: none; }
    .topbar { justify-content: flex-end; }
    aside { border: 0; padding: 10px 16px; }
    aside.left { display: flex; gap: 8px; overflow-x: auto; padding-top: max(10px, env(safe-area-inset-top)); }
    aside.left h2, aside.left .muted, aside.left .floor span { display: none; }
    aside.left .floor { flex: 1; min-width: 96px; margin: 0; padding: 6px 8px; }
    aside.left .floor.on { padding: 5px 7px; }
    aside.left .floor .badge { width: 28px; height: 28px; font-size: 11px !important; }
    aside.right { padding-bottom: max(16px, env(safe-area-inset-bottom)); }
  }
  .notice { position: absolute; left: 50%; top: 64px; transform: translateX(-50%); z-index: 6; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; max-width: min(420px, calc(100% - 32px)); box-shadow: 0 4px 16px #0000001a; }
  .notice p { margin: 0 0 8px; }
  .floor:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* 일 맡기기 */
  .taskbar { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); width: min(560px, calc(100% - 140px)); z-index: 7; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 8px 10px; box-shadow: 0 4px 16px #0000001a; }
  .tb-top { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); margin-bottom: 6px; }
  .tb-to b { color: var(--text); }
  .tb-to button { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0 2px; }
  .tb-quick { margin-left: auto; display: flex; gap: 4px; }
  .tb-quick button, .rq button { border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 8px; font-size: 11px; padding: 3px 8px; cursor: pointer; }
  .tb-form { display: flex; gap: 6px; }
  .tb-form input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; font: inherit; background: var(--bg); color: var(--text); }
  .tb-form button { border: 0; border-radius: 9px; padding: 0 14px; background: #67C8F2; color: #fff; font-weight: 700; cursor: pointer; }
  .tb-msg { font-size: 11.5px; margin-top: 5px; color: var(--muted); min-height: 0; }
  .tb-msg.warn { color: #b0533f; }
  .taskbar .tb-link { display: block; text-align: center; padding: 6px; color: var(--text); font-weight: 600; text-decoration: none; }
  .av .paper { position: absolute; right: -16px; top: 10px; width: 13px; height: 16px; background: #fff; border: 1px solid #c9d6de; border-radius: 2px; transform: rotate(-8deg); box-shadow: 2px 2px 0 #fff, 2px 2px 0 1px #c9d6de; font-size: 8px; line-height: 15px; text-align: center; color: #35424B; font-weight: 700; }
  .av.cheer .person, .av.cheer .sprite { animation: cheer .7s ease-in-out infinite; }
  .av.cheer .bubble { display: block !important; border-color: #EE9F8E; }
  .av .arm { display: none; position: absolute; top: 3px; width: 4px; height: 13px; border-radius: 3px; }
  .av.cheer .arm { display: block; }
  .av .arm.l { left: 0; transform: rotate(-25deg); } .av .arm.r { right: 0; transform: rotate(25deg); }
  @keyframes cheer { 50% { transform: translateY(-5px); } }
  .queue { position: absolute; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; gap: 3px; z-index: 9000; cursor: pointer; }
  .queue .stack { display: flex; gap: 3px; }
  .side-head { font-size: 11px; font-weight: 700; color: var(--muted); padding: 10px 0 2px; border-top: 1px solid var(--line); }
  .pop { position: absolute; left: 50%; top: 92px; transform: translateX(-50%); width: min(340px, calc(100% - 28px)); z-index: 9500; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 10px 30px #4a5d7026; padding: 12px 14px; font-size: 12.5px; }
  .pop h3 { margin: 0 26px 4px 0; font-size: 14px; }
  .pop .x { position: absolute; right: 8px; top: 6px; border: 0; background: none; font-size: 18px; cursor: pointer; color: var(--muted); }
  .pop .sub { color: var(--muted); font-size: 11px; margin-bottom: 8px; }
  .pop .what { background: var(--bg); border-radius: 8px; padding: 7px 9px; margin-bottom: 8px; line-height: 1.45; }
  .pop ul { list-style: none; margin: 0; padding: 0; } .pop li { padding: 6px 0; border-top: 1px solid var(--line); display: flex; gap: 6px; align-items: center; justify-content: space-between; }
  .pop li span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .pop button.ok, .pop button.no, .pop a.go { flex: none; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 4px 9px; font: inherit; font-size: 11.5px; cursor: pointer; color: var(--text); text-decoration: none; }
  .pop button.ok { background: #3FB37F; border-color: #3FB37F; color: #fff; font-weight: 700; }
  .queue .stack i { width: 11px; height: 14px; background: #fff; border: 1px solid #E8C25A; border-radius: 2px; }
  .queue span { background: #FFF6DA; border: 1px solid #E8C25A; color: #7a5b0e; border-radius: 7px; padding: 1px 7px; font-size: 10.5px; font-weight: 700; white-space: nowrap; }
  .rq { display: flex; gap: 8px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 12px; }
  .rq:last-child { border-bottom: 0; }
  .rq .meta { flex: 1; min-width: 0; }
  .rq .sub { color: var(--muted); font-size: 11px; }
  .chip.hold { background: #FFF6DA; color: #7a5b0e; } .chip.new { background: #e6efff; color: var(--blue); } .chip.assigned { background: #f1ebff; color: #7a4fd0; } .chip.done { background: #e8f6ee; color: var(--green); }
  .hint { display: none; }
  @media (max-width: 900px) {
    .taskbar { position: fixed; left: 0; right: 0; bottom: 0; transform: none; width: auto; border-radius: 14px 14px 0 0; padding-bottom: max(8px, env(safe-area-inset-bottom)); }
    .app { padding-bottom: 120px; }
    .tb-quick { margin-left: 0; }
  }
  .led { animation: blink 1.6s steps(2, jump-none) infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { .led { animation: none; }
  }
  @media (prefers-reduced-motion: reduce) { .av, .av .person { transition: none; animation: none; } }

/* 공유 관제탑: 기존 사람·층·상태 위에 공간의 온기만 더합니다. */
:root { --bg:#f8f5f3; --panel:#fffdfb; --line:#e5e5e9; --stage:#edf3f9; --accent:#d58e7b; }
main { background:radial-gradient(ellipse at 85% 12%,#fff0dd88,transparent 55%),linear-gradient(155deg,#edf3fb,#f7eff4 65%,#edf5f7); }
aside { background:linear-gradient(180deg,var(--panel),var(--bg)); }
.card { border-radius:16px; box-shadow:0 4px 16px #667f9906; }
.floor { border-radius:13px; padding:12px 10px; transition:background .2s; }
.floor.on { padding:11px 9px; background:#e9f5fc; }
.pill { box-shadow:0 5px 18px #5d7a9310; border-radius:14px; }
.pj { box-shadow:0 2px 7px #687d8a08; }
.room-label { fill:#67758b; font-size:11px; letter-spacing:.6px; }
.floor-label { fill:#4e6d8b; }.floor-sub { fill:#8895a5; }
.av .bubble { box-shadow:0 4px 12px #566f8520; }
.av .tag { box-shadow:0 2px 8px #566f8512; }
#world #map { filter:drop-shadow(0 14px 15px #7490ab1e); }
.zoom { border-radius:13px; box-shadow:0 4px 20px #5a70851a; }
.taskbar { border-radius:16px; box-shadow:0 6px 24px #5c70851a; }
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:#1e2128;--bg:#16181d;--line:#2e323b;--stage:#111317} :root:not([data-theme="light"]) main{background:radial-gradient(ellipse at top right,#2e2935,#182330 70%)} :root:not([data-theme="light"]) .floor.on{background:#253f52}}
:root[data-theme="dark"] main{background:radial-gradient(ellipse at top right,#2e2935,#182330 70%)}
:root[data-theme="dark"] .floor.on{background:#253f52}

.floor-art{pointer-events:none}.floor-art.loaded ~ .floor-vector{visibility:hidden}#map.artwork-off .floor-art{display:none}#map.artwork-off .floor-vector{visibility:visible}#zart[hidden]{display:none}
/* 생성 배경의 가구 원근 차이만 보정. 데이터 좌표/선택 대상은 그대로입니다. */
#map:has(.floor-art.loaded):not(.artwork-off) + #people .av[data-room="tower"]{translate:-75px 30px}
#map:has(.floor-art.loaded):not(.artwork-off) + #people .av[data-room="rue"]{translate:5px 55px}
.snapshot-note{font-size:11px;color:var(--muted);line-height:1.65;margin:0 0 10px;padding:8px;background:var(--bg);border-radius:8px}
#map:has(.floor-art.loaded):not(.artwork-off) + #people .av[data-room="desk"]{translate:18px 38px}
#map:has(.floor-art.loaded):not(.artwork-off) + #people .av[data-room="dev"]{translate:0 40px}
.app[data-floor="1F"] #world [data-floor="2F"],.app[data-floor="1F"] #world [data-floor="2F"] *,.app[data-floor="2F"] #world [data-floor="1F"],.app[data-floor="2F"] #world [data-floor="1F"] *{visibility:hidden}
</style>
<div class="app">
  <aside class="left" id="floors"></aside>
  <main id="stage">
    <div class="topbar">
      <div class="pill" id="title"><span class="fl">—</span><b>가상스튜디오</b></div>
      <div class="pill live-pill off" id="live">● 불러오는 중</div>
    </div>
    <div class="projbar" id="projbar"></div>
    <div id="world"><svg id="map"></svg><div id="people"></div></div>
    <div class="zoom"><button id="zin">+</button><button id="zout">−</button><button id="zfit" title="맞춤">⟲</button><button id="zwide" title="넓게 보기">⤢</button><button id="zart" title="그림 배경 전환" aria-pressed="true" hidden>◈</button></div>
    <div class="pop" id="pop" hidden></div>
    <div class="notice" id="notice" hidden><p></p></div>
    <div class="hint">"사무실 갱신"이라고 말하면 새로 채워요 · 드래그로 이동</div>
    <div class="taskbar" id="taskbar">
      <div class="tb-top"><span class="tb-to">받는 사람: <b id="tb-to">이음 대표</b> <button id="tb-clear" type="button" hidden aria-label="이음 대표에게로 돌리기">✕</button></span>
        <span class="tb-quick"><button type="button" data-q="pause">잠깐 멈춰</button><button type="button" data-q="first">이거 먼저</button><button type="button" data-q="ask">끝났어?</button></span></div>
      <form class="tb-form" id="tb-form"><input id="tb-text" maxlength="240" autocomplete="off" placeholder="예: 오늘 회의록 정리해" aria-label="맡길 일"><button type="submit">맡기기</button></form>
      <div class="tb-msg" id="tb-msg" role="status"></div>
    </div>
  </main>
  <aside class="right">
    <div class="card"><h2>사무실 사람들 <small id="count"></small></h2><p class="snapshot-note">저장된 현황 · 실시간 상태와 다를 수 있어요.<br>상단의 마지막 갱신 시각을 확인해 주세요.</p><div id="list"></div></div>
    <div class="card" id="rq-card"><h2>맡긴 일 <small id="rq-count"></small></h2><div id="rq-list"></div></div>
    <div class="card"><h2>활동 로그</h2><ul class="log" id="log"></ul></div>
    <div class="card"><h2>어디서 무엇을 하나</h2><div class="legend" id="legend"></div></div>
  </aside>
</div>

<script>

// ---------- 지도 ----------
// 두 층짜리 건물. 방 좌표는 각 층 안에서의 칸 좌표.
const TW = 56, TH = 28, WALL = 64, PAD = 24, GAP = 26;
const COLS = 24, ROWS = 13;
const FLOORS = [
  { id: '2F', name: '대표층', sub: '이음 대표실 · 루에 대표실 · 라운지 · 회의실', color: '#67C8F2' },
  { id: '1F', name: '작업층', sub: '자리 · 개발 · 자료 · 검색 · 서버', color: '#EE9F8E' },
];
const ROOMS = [
  { id: 'huddle',   floor: '2F', name: '소회의실',    x: 0,  y: 0, w: 3,  h: 7, color: '#F4F0F8', what: '짧은 논의 · 둘이 맞춰 보기' },
  { id: 'tower',    floor: '2F', name: '이음 대표실',    x: 3,  y: 0, w: 10.5, h: 7, color: '#F0EEF6', what: '이음 대표 · 루에 대표실과 동일 면적' },
  { id: 'rue',      floor: '2F', name: '루에 대표실', x: 13.5, y: 0, w: 10.5, h: 7, color: '#ECF7FC', what: '루에 대표 · 이음 대표실과 동일 면적' },
  { id: 'lounge',   floor: '2F', name: '라운지',      x: 0,  y: 7, w: 13, h: 6, color: '#FFF7F2', what: '쉬는 중' },
  { id: 'meeting',  floor: '2F', name: '회의실',      x: 13, y: 7, w: 11, h: 6, color: '#EEF7F2', what: '계획 · 할 일 · 연결 도구' },
  { id: 'desk',     floor: '1F', name: '내 자리',     x: 0,  y: 0, w: 13, h: 7, color: '#F3F8FB', what: '답변 · 다음 요청 대기' },
  { id: 'dev',      floor: '1F', name: '개발실',      x: 13, y: 0, w: 11, h: 7, color: '#EDF7F2', what: '코드 작성 · 수정' },
  { id: 'library',  floor: '1F', name: '자료실',      x: 0,  y: 7, w: 7,  h: 6, color: '#FAF5E8', what: '파일 읽기 · 검색' },
  { id: 'search',   floor: '1F', name: '정보검색실',  x: 7,  y: 7, w: 6,  h: 6, color: '#EEF7FA', what: '웹 검색 · 웹 읽기' },
  { id: 'server',   floor: '1F', name: '서버실',      x: 13, y: 7, w: 6,  h: 6, color: '#EDF0F3', what: '명령 실행 · git' },
  { id: 'elevator', floor: '1F', name: '엘리베이터',  x: 19, y: 7, w: 5,  h: 6, color: '#F2EFF8', what: '서브에이전트 호출' },
];
const roomFloor = Object.fromEntries(ROOMS.map(r => [r.id, r.floor]));
const OX = ROWS * TW / 2 + PAD, OY = WALL + PAD + 20;
const iso = (x, y) => [ (x - y) * TW / 2 + OX, (x + y) * TH / 2 + OY ];
const pts = (arr) => arr.map(p => p.join(',')).join(' ');
const SLAB_W = (COLS + ROWS) * TW / 2 + PAD * 2, SLAB_H = (COLS + ROWS) * TH / 2 + OY + PAD;
const floorDy = f => Math.max(0, FLOORS.findIndex(x => x.id === f)) * (SLAB_H + GAP);
const WORLD_W = SLAB_W, WORLD_H = FLOORS.length * SLAB_H + (FLOORS.length - 1) * GAP;

function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const c = [n >> 16, (n >> 8) & 255, n & 255].map(v => Math.max(0, Math.min(255, Math.round(v * f))));
  return '#' + c.map(v => v.toString(16).padStart(2, '0')).join('');
}
const up = (p, z) => [p[0], p[1] - z];
// z0 만큼 떠 있는 상자(책상 상판 등)
function box(x, y, w, d, h, color, z0 = 0) {
  const a = iso(x, y), b = iso(x + w, y), c = iso(x + w, y + d), e = iso(x, y + d);
  const t = z0 + h;
  return `<polygon points="${pts([up(a, t), up(b, t), up(c, t), up(e, t)])}" fill="${color}" stroke="#00000010"/>` +
         `<polygon points="${pts([up(e, z0), up(c, z0), up(c, t), up(e, t)])}" fill="${shade(color, .88)}" stroke="#00000010"/>` +
         `<polygon points="${pts([up(c, z0), up(b, z0), up(b, t), up(c, t)])}" fill="${shade(color, .78)}" stroke="#00000010"/>`;
}
function slots(r) {
  const out = [];
  if (r.id === 'desk') { for (const j of [2.4, 5.4]) for (const i of [2.4, 5.4, 8.4, 11.2]) out.push([r.x + i, r.y + j]); return out; }
  if (r.id === 'dev') { for (const j of [2.4, 5.4]) for (const i of [2.6, 5.6, 8.6]) out.push([r.x + i, r.y + j]); return out; }
  if (r.id === 'lounge') { for (const j of [1.6, 3.4, 5.2]) for (const i of [5.4, 7.8, 10.2]) out.push([r.x + i + (j > 3 ? .5 : 0), r.y + j]); return out; }
  for (let j = 1.6; j < r.h - .4; j += 2.2) for (let i = 1.4; i < r.w - .4; i += 2) out.push([r.x + i, r.y + j]);
  return out;
}
// ---------- 인테리어 (루에 명세 1020_GPT_가상스튜디오_인테리어: 화이트·하늘 + 코랄·민트·버터·라벤더) ----------
const C = { wall: '#F7FAFC', ink: '#35424B', glass: '#BFE7F7', sky: '#67C8F2', coral: '#EE9F8E', mint: '#91CDB8', butter: '#F3D987', lav: '#B5A2D3', wood: '#E9D5B5', white: '#FFFFFF', leaf: '#91CDB8', pot: '#FFFFFF', line: '#dfe6ec' };
const WH = WALL; // 벽 높이(px)
function rug(x, y, w, d, color, op = 1) { return `<polygon points="${pts([iso(x, y), iso(x + w, y), iso(x + w, y + d), iso(x, y + d)])}" fill="${color}" opacity="${op}"/>`; }
// 뒤쪽 벽에 붙는 판: along='x'면 y=fixed 벽, 'y'면 x=fixed 벽
function wallPanel(along, fixed, from, to, z0, z1, color, stroke = '#00000014') {
  const P = along === 'x' ? (t) => iso(t, fixed) : (t) => iso(fixed, t);
  return `<polygon points="${pts([up(P(from), z0), up(P(to), z0), up(P(to), z1), up(P(from), z1)])}" fill="${color}" stroke="${stroke}"/>`;
}
function windowOn(along, fixed, from, to) {
  const id = `coast-${along}-${fixed}-${from}`.replaceAll('.', '_');
  const P = (t,z) => up(along === 'x' ? iso(t,fixed) : iso(fixed,t),z);
  const q = (u,z) => P(from+(to-from)*u,z);
  const pathPts = arr => arr.map(([u,z])=>q(u,z).join(',')).join(' ');
  const a=P(from,18), b=P(to,18), c=P(to,48), d=P(from,48), peak=P((from+to)/2,75);
  const arch=`M${a} L${b} L${c} Q${peak} ${d} Z`;
  let out=`<defs><clipPath id="${id}"><path d="${arch}"/></clipPath><linearGradient id="${id}-sky" x2="0" y2="1"><stop stop-color="#f8d9bf"/><stop offset=".5" stop-color="#d6e7f4"/><stop offset="1" stop-color="#a9d7ed"/></linearGradient></defs>`;
  out+=`<path d="${arch}" fill="url(#${id}-sky)" stroke="#fffaf5" stroke-width="4"/><g clip-path="url(#${id})">`;
  out+=`<polygon points="${pathPts([[0,18],[1,18],[1,33],[.85,36],[.65,32],[.48,42],[.3,36],[.12,41],[0,34]])}" fill="#a6b7c3"/>`;
  out+=`<polygon points="${pathPts([[0,18],[1,18],[1,27],[.8,29],[.6,26],[.35,32],[.1,28],[0,30]])}" fill="#8faaa9" opacity=".7"/>`;
  out+=`<polygon points="${pathPts([[0,18],[1,18],[1,25],[0,25]])}" fill="#b3def0"/>`;
  for(let i=0;i<7;i++) { const u=.08+i*.14, h=27+(i%3)*2;out+=`<polygon points="${pathPts([[u,25],[u+.045,25],[u+.045,h],[u,h]])}" fill="#eaf0ef"/>`; }
  const sun=q(.82,49);out+=`<circle cx="${sun[0]}" cy="${sun[1]}" r="4" fill="#fff9df"/>`;
  out+=`<polyline points="${pathPts([[.04,23],[.22,24],[.46,23],[.72,24],[.96,23]])}" fill="none" stroke="#fff9ec" stroke-width="1"/>`;
  out+=`</g><path d="${arch}" fill="none" stroke="#fefcf8" stroke-width="2"/>`;
  const mid=(from+to)/2;out+=wallPanel(along,fixed,mid-.035,mid+.035,18,57,C.white,'none');
  return out;
}
function plant(x, y, k = 1, z = 0) {
  const [px, py] = iso(x, y);
  return `<g transform="translate(0 ${-z})"><ellipse cx="${px}" cy="${py}" rx="${10 * k}" ry="${5 * k}" fill="#00000010"/>` + box(x - .22 * k, y - .22 * k, .44 * k, .44 * k, 13 * k, C.pot) +
    `<ellipse cx="${px - 7 * k}" cy="${py - 28 * k}" rx="${5 * k}" ry="${13 * k}" transform="rotate(-24 ${px - 7 * k} ${py - 28 * k})" fill="${C.leaf}"/>` +
    `<ellipse cx="${px + 7 * k}" cy="${py - 28 * k}" rx="${5 * k}" ry="${13 * k}" transform="rotate(24 ${px + 7 * k} ${py - 28 * k})" fill="${shade(C.leaf, .9)}"/>` +
    `<ellipse cx="${px}" cy="${py - 33 * k}" rx="${5.5 * k}" ry="${15 * k}" fill="${shade(C.leaf, 1.06)}"/></g>`;
}
function legs(x, y, w, d, h, color = C.wood) { let s = ''; for (const [lx, ly] of [[x + .06, y + d - .1], [x + w - .1, y + d - .1], [x + w - .1, y + .06]]) s += box(lx, ly, .05, .05, h, color); return s; }
function table(x, y, w, d, h = 16, color = C.wood, leg = C.wood) { return legs(x, y, w, d, h, leg) + box(x, y, w, d, 2.5, color, h); }
// 책상 위 납작한 소품(메모·매트·책 등)
function flat(x, y, w, d, z, color, h = 1.5) { return box(x, y, w, d, h, color, z); }
function cup(x, y, z, color = C.white, h = 6) { return box(x, y, .2, .2, h, color, z); }
function monitor(x, y, w = .55, z = 18.5) {
  const a = up(iso(x, y), z + 3), b = up(iso(x + w, y), z + 3), c = up(iso(x + w, y), z + 16), d = up(iso(x, y), z + 16);
  return box(x + w / 2 - .04, y + .02, .08, .08, 3, C.ink, z) + `<polygon points="${pts([a, b, c, d])}" fill="${C.ink}"/>`;
}
function chair(x, y, color = C.white) { return box(x, y, .45, .45, 9, color) + box(x, y + .38, .45, .07, 20, color); }
function sofa(x, y, w, color = C.coral, accent) {
  return box(x,y,w,.9,9,color)+box(x,y+.7,w,.2,22,shade(color,.95))+
    box(x+.1,y+.1,w/2-.15,.6,4,accent||shade(color,1.06),9)+box(x+w/2+.05,y+.1,w/2-.15,.6,4,shade(color,1.06),9)+
    box(x+.12,y+.15,.4,.42,9,C.glass,13)+box(x+w-.6,y+.2,.38,.38,8,C.lav,13)+
    flat(x+w*.4,y+.02,.46,.72,14,'#f8e4d8',1.5);
}
function shelf(x, y, w, h) {
  let s = box(x, y, w, .4, h, C.wood);
  const cols = [C.glass, C.coral, C.lav, C.white, C.butter];
  for (let k = 0; k < 3; k++) for (let i = 0; i < 4; i++) {
    const t0 = x + .1 + i * (w - .2) / 4, t1 = t0 + (w - .2) / 4 - .05, z0 = 5 + k * (h - 6) / 3, z1 = z0 + (h - 6) / 3 - 4;
    s += `<polygon points="${pts([up(iso(t0, y + .41), z0), up(iso(t1, y + .41), z0), up(iso(t1, y + .41), z1), up(iso(t0, y + .41), z1)])}" fill="${cols[(i + k) % cols.length]}"/>`;
  }
  return s;
}
function led(x, y, z, color, delay) { const [px, py] = up(iso(x, y), z); return `<circle class="led" style="animation-delay:${delay}s" cx="${px}" cy="${py}" r="1.6" fill="${color}"/>`; }
function floorLamp(x, y) {
  const [px, py] = iso(x, y);
  return `<ellipse cx="${px}" cy="${py}" rx="6" ry="3" fill="#00000014"/><rect x="${px - 1}" y="${py - 46}" width="2" height="46" fill="${C.ink}"/><polygon points="${px - 8},${py - 42} ${px + 8},${py - 42} ${px + 5},${py - 54} ${px - 5},${py - 54}" fill="${C.butter}"/><ellipse cx="${px}" cy="${py - 40}" rx="14" ry="5" fill="#fff3c4" opacity=".5"/>`;
}
function roundRug(x, y, rx, ry, color) { const [px, py] = iso(x, y); return `<ellipse cx="${px}" cy="${py}" rx="${rx}" ry="${ry}" fill="${color}"/>`; }
function roundTable(x, y, r = 11, h = 10, color = C.white) { const [px, py] = iso(x, y); return `<rect x="${px - 1.5}" y="${py - h}" width="3" height="${h}" fill="${C.wood}"/><ellipse cx="${px}" cy="${py - h}" rx="${r}" ry="${r / 2}" fill="${color}" stroke="#00000014"/>`; }
function ottoman(x, y, color = C.coral) { const [px, py] = iso(x, y); return `<path d="M${px - 11} ${py - 10} v8 a11 5.5 0 0 0 22 0 v-8" fill="${shade(color, .88)}"/><ellipse cx="${px}" cy="${py - 10}" rx="11" ry="5.5" fill="${color}"/>`; }
function pinboard(fixed, from, to, X) {
  let s = wallPanel('x', fixed, from, to, 24, 48, '#E9C99A', '#c9a878');
  const notes = [C.butter, C.coral, C.glass, C.mint, C.lav, C.white];
  notes.forEach((c, i) => { const t = from + .15 + (i % 3) * (to - from - .3) / 3, z = 30 + Math.floor(i / 3) * 9; s += wallPanel('x', fixed, t, t + .3, z, z + 6, c, 'none'); });
  return s;
}
// 벽 액자
function frame(along, fixed, from, to, z0, color) { const m = (to - from) * .18; return wallPanel(along, fixed, from, to, z0, z0 + 14, C.white, '#c9d6de') + wallPanel(along, fixed, from + m, to - m, z0 + 3, z0 + 11, color, 'none'); }
// 세워 둔 책 몇 권
function books(x, y, z, n = 4, w = .6) { const cols = [C.glass, C.coral, C.lav, C.butter, C.mint]; let s = ''; for (let i = 0; i < n; i++) s += box(x + i * w / n, y, w / n - .02, .22, 7 + (i % 2) * 2, cols[i % cols.length], z); return s; }
// 낮은 수납장(위에 책)
function cabinet(x, y, w, d, h, color, n = 4) { return box(x, y, w, d, h, color) + books(x + .1, y + .05, h, n, Math.min(w - .3, .8)); }
// 투명 과자통(하늘 뚜껑·쿠키)
function cookieJar(x, y, z) {
  const [px, py] = up(iso(x, y), z);
  return `<path d="M${px - 6} ${py - 12} v12 a6 3 0 0 0 12 0 v-12" fill="${C.glass}" fill-opacity=".45" stroke="#8fcbe4" stroke-width=".8"/>` +
    `<circle cx="${px - 2.5}" cy="${py - 3}" r="2.6" fill="#C9975B"/><circle cx="${px + 2.5}" cy="${py - 4}" r="2.6" fill="#C9975B"/><circle cx="${px}" cy="${py - 7.5}" r="2.6" fill="#C9975B"/>` +
    `<ellipse cx="${px}" cy="${py - 12}" rx="6.6" ry="3.2" fill="${C.sky}"/><ellipse cx="${px}" cy="${py - 14}" rx="2.4" ry="1.3" fill="${shade(C.sky, .9)}"/>`;
}
function workDesk(x, y, dual, chairColor = C.white, mat) {
  return table(x - .7, y - 1.1, 1.4, .65, 16, C.white) + (mat ? flat(x - .45, y - .75, .85, .3, 18.5, mat, 1) : '') +
    monitor(x - (dual ? .6 : .3), y - 1.02) + (dual ? monitor(x + .02, y - 1.02) : '') + chair(x - .2, y - .35, chairColor);
}

function manuscript(x,y,z) {
  let out=flat(x,y,.58,.44,z,C.white,.7);
  for(let i=0;i<3;i++)out+=flat(x+.08,y+.08+i*.09,.39,.012,z+1,'#aebed0',.15);
  return out;
}
function dayCalendar(x,y,z) {
  const a=up(iso(x,y),z),b=up(iso(x+.46,y),z),c=up(iso(x+.46,y),z+12),d=up(iso(x,y),z+12);
  return `<polygon points="${pts([a,b,c,d])}" fill="#fffaf2" stroke="#b9d2d6" stroke-width=".7"/>`+wallPanel('x',y,x,x+.46,z+9,z+12,C.mint,'none')+wallPanel('x',y,x+.13,x+.33,z+3,z+6,C.coral,'none');
}
function finishingTouches(r) {
  const X=r.x,Y=r.y,W=r.w,H=r.h;let out='';
  if(r.id==='rue') {
    out+=manuscript(X+1.9,Y+1.9,18.5)+dayCalendar(X+5.9,Y+.25,12);
    out+=floorLamp(X+6.25,Y+2.4)+books(X+8.3,Y+.1,0,5,.85);
    out+=plant(X+5.75,Y+.25,.48,12)+plant(X+9.6,Y+.12,.55,0);
  }
  if(r.id==='tower')out+=manuscript(X+3.9,Y+1.95,18.5)+cookieJar(X+6.2,Y+1.7,12)+dayCalendar(X+5,Y+1.6,18.5);
  if(r.id==='lounge')out+=windowOn('y',X,Y+3.7,Y+5.6)+plant(X+.25,Y+3.4,.7)+ottoman(X+3.8,Y+2.5,C.lav);
  if(r.id==='desk'||r.id==='dev') {
    const S=slots(r);out+=manuscript(S[0][0]-.45,S[0][1]-.65,18.5);
    out+=books(X+W-1.1,Y+.15,0,5,.7);
  }
  if(r.id==='library')out+=manuscript(X+2.4,Y+3.5,8)+plant(X+3.9,Y+.15,.45,50);
  if(r.id==='search')out+=pinboard(Y,X+1.2,X+3.3);
  if(r.floor==='2F') {
    // Low border plants leave the existing activity slots clear.
    if(r.id==='meeting')out+=plant(X+W-.35,Y+H-1.9,.55)+plant(X+W-.35,Y+H-3,.65);
    if(r.id==='lounge')out+=plant(X+.3,Y+H-.3,.6)+plant(X+1.1,Y+H-.3,.5);
  }
  return `<g class="workroom-details" aria-hidden="true">${out}</g>`;
}
function furniture(r) {
  let s = '';
  const S = slots(r), X = r.x, Y = r.y, W = r.w, H = r.h;
  if (r.id === 'tower') {
    for (let i = 0; i < 3; i++) s += wallPanel('x', Y, X + 1.2 + i * 1.8, X + 2.8 + i * 1.8, 22, 50, C.ink, 'none') + wallPanel('x', Y, X + 1.3 + i * 1.8, X + 2.7 + i * 1.8, 24, 48, C.glass, 'none'); // 상황판 3개(바탕 통일)
    s += windowOn('x', Y, X + 7.4, X + 9.2) + frame('y', X, Y + 1.2, Y + 2.2, 26, C.lav);
    s += table(X + 2.4, Y + 1.5, 3, .8, 16, C.wood, C.ink) + monitor(X + 2.7, Y + 1.58) + monitor(X + 3.6, Y + 1.58) + monitor(X + 4.5, Y + 1.58);
    s += cup(X + 5.1, Y + 1.9, 18.5, C.white) + flat(X + 2.45, Y + 1.85, .5, .35, 18.5, C.lav, 3) + chair(X + 3.6, Y + 2.5, C.coral);
    s += ottoman(X + 1.8, Y + 2.3) + cabinet(X + 5.8, Y + 1.5, 1.4, .6, 12, C.white) + plant(X + 6.9, Y + 1.7, .45, 12);
    s += plant(X + .6, Y + .7, .9) + plant(X + W - .6, Y + H - .7, .9);
  }
  if (r.id === 'rue') {
    s += windowOn('x', Y, X + 1, X + 5.4) + windowOn('x', Y, X + 8.4, X + 10.4);
    s += table(X + 1.8, Y + 1.6, 1.8, .8, 16, C.white) + monitor(X + 2.4, Y + 1.7, .65) + chair(X + 2.5, Y + 2.6, C.sky);
    s += flat(X + 3.0, Y + 1.95, .5, .35, 18.5, C.glass, 1.5); // 스케치북
    s += box(X + 3.8, Y + 1.8, .5, .5, 12, C.white) + cookieJar(X + 4.05, Y + 2.05, 12); // 낮은 수납 위 과자통
    s += cabinet(X + 5.6, Y + .15, 1.2, .45, 12, C.wood, 5) + frame('x', Y, X + 6.0, X + 6.6, 30, C.lav) + frame('x', Y, X + 10.5, X + 10.9, 30, C.coral);

function fit() {
  const top = floor === '*' ? 0 : floorDy(floor), h = floor === '*' ? WORLD_H : SLAB_H;
  // 폰: 첫 화면을 사무실로 채우고 '사무실 사람들' 제목까지만 보이게. 양옆은 끌어서 보기

    const k = Math.min((avail - 92) / h, 1.6 * stage.clientWidth / WORLD_W);
    stage.style.height = Math.round(Math.min(avail, h * k + 100)) + 'px';
  } else stage.style.height = '';
  const r = stage.getBoundingClientRect();
  view.k = phone ? Math.min((r.height - 92) / h, 1.6 * r.width / WORLD_W) : Math.min(r.width / WORLD_W, (r.height - 88) / h);

      el.querySelector('.body').style.background = s.color || colorOf(s.project);
      const b = el.querySelector('.bubble');
      const icon = { working: '🔧 ', thinking: '💭 ', waiting: '💬 ', idle: '☕ ' }[s.state];
      b.textContent = cheer ? '🙌 끝났습니다!' : icon + (s.bubble || STATE_KO[s.state]); b.title = cheer ? desk.done.map(r => r.text || '').join('\n') : s.bubble;
      el.querySelector('.nm').textContent = (s.isSubagent ? '↳ ' : '') + roleName(s);
      el.title = roleName(s);
      el.querySelector('.tag .dot').className = 'dot ' + (s.state === 'working' || s.state === 'thinking' ? 'live' : '');
      seen.add(s.id);
    });
  }
  for (const [id, el] of els) if (!seen.has(id)) { el.remove(); els.delete(id); }
  // 확인 대기 줄: 2층 대표실 앞
  let q = document.getElementById('queue');
  const hold = reqs.filter(r => r.status === 'hold');
  if (!q) { q = document.createElement('div'); q.id = 'queue'; q.className = 'queue'; q.onclick = e => { e.stopPropagation(); showQueue(); }; host.appendChild(q); }
  q.hidden = !hold.length;
  if (hold.length) {
    const [qx, qy] = iso(15.2, 6.7); q.style.left = qx + 'px'; q.style.top = (qy + floorDy('2F')) + 'px';
    q.innerHTML = `<div class="stack">${hold.slice(0, 6).map(() => '<i></i>').join('')}</div><span>확인 대기 ${hold.length}</span>`;
  }
}

// ---------- 일 맡기기 ----------
// 화면은 실행하지 않는다: requests 기록에 한 줄 남기고, 이음(대표)에게 알리면 이음이 작업자에게 나눠 준다.
let reqs = [];
const OPEN = new Set(['new', 'assigned']);
const seenDone = new Set(JSON.parse(store.get('vs-seen-done') || '[]'));
function deskOf(s) {
  const mine = r => r.to === s.id || (r.to === 'boss' && s.room === 'tower');
  return {
    open: reqs.filter(r => OPEN.has(r.status) && mine(r)).length,
    done: reqs.filter(r => r.status === 'done' && mine(r) && !seenDone.has(r.id) && Date.now() - (Date.parse(r.doneAt) || 0) < 12 * 3600e3),
  };
}
function seeDone(id) {
  const s = state?.sessions.find(x => x.id === id); if (!s) return;
  deskOf(s).done.forEach(r => seenDone.add(r.id));
  store.set('vs-seen-done', JSON.stringify([...seenDone].slice(-200)));
}
const CMD = /(^\s*[$#>\/\\]|`|\$\(|&&|\|\||[;|]\s*[a-z]|\b(sudo|rm|curl|wget|chmod|chown|npm|npx|pip3?|brew|git|bash|zsh|sh|python3?|node|ssh|scp|kill|mkdir|osascript|powershell)\s+[-\w.\/~])/i;
const RISK = /설치|깔아|깔기|삭제|지워|지우|없애|결제|구매|구독|송금|이체|입금|돈|비용|유료|사\s?줘|보내|전송|발송|메일|문자|올려|업로드|공유|게시|배포|install|delete|remove|pay|buy|purchase|send|e-?mail|upload|share|publish|deploy/i;
const QUICK = { pause: '잠깐 멈춰', first: '이거 먼저', ask: '끝났어?' };
const tb = { to: document.getElementById('tb-to'), clear: document.getElementById('tb-clear'), text: document.getElementById('tb-text'), msg: document.getElementById('tb-msg') };
function target() {
  const s = state?.sessions.find(x => x.id === selected);
  return !s || s.room === 'tower' ? { id: 'boss', name: '이음 대표' } : { id: s.id, name: roleName(s) };
}
function say(t, warn) { tb.msg.textContent = t; tb.msg.className = 'tb-msg' + (warn ? ' warn' : ''); }
function renderTaskbar() {
  const t = target(); tb.to.textContent = t.name; tb.clear.hidden = t.id === 'boss';
  const list = reqs.slice().sort((a, b) => (b.at || '').localeCompare(a.at || '')).slice(0, 20);
  document.getElementById('rq-count').textContent = list.length ? `${reqs.filter(r => r.status !== 'done').length}건 진행` : '';
  const KO = { hold: '확인 대기', new: '접수', assigned: '하는 중', done: '끝남' };
  document.getElementById('rq-list').innerHTML = list.length ? list.map(r => `
    <div class="rq" data-id="${esc(r.id)}"><div class="meta"><b>${esc(r.text || QUICK[r.kind] || '맡긴 일')}</b>
      <div class="sub">${esc((r.toName || '이음 대표').replace('총괄 (이음)', '이음 대표'))} · ${r.at ? ago(Date.parse(r.at), Date.now()) : ''}${r.note ? ' · ' + esc(r.note) : ''}</div>
      ${r.status === 'hold' && dbRef ? '<div style="margin-top:5px;display:flex;gap:5px"><button data-act="ok">확인하고 맡기기</button><button data-act="no">취소</button></div>' : ''}</div>
      <span class="chip ${esc(r.status)}">${KO[r.status] || esc(r.status)}</span></div>`).join('')
    : '<div class="empty">아래 칸에 할 일을 적어 맡겨 보세요.</div>';
  document.querySelectorAll('.rq button').forEach(b => b.onclick = () => holdAnswer(b.closest('.rq').dataset.id, b.dataset.act === 'ok', b));
}
let dbRef = null, comments = null;
async function notifyBoss(r) {
  // 이음에게 알림: 댓글 'Claude에게 보내기'. 안 되면 기록만 남고 다음 확인 때 처리.
  try {
    comments ||= await window.claude.use('comments');
    if (!comments || (await comments.canSendToClaude()) !== 'available') return false;
    const anchor = await comments.anchorFor(document.getElementById('taskbar'));
    await comments.sendToClaude({ anchor, text: `[일 맡기기] ${r.toName}에게: ${r.text || QUICK[r.kind]} (요청 ${r.id})` });
    return true;
  } catch (e) { return false; }
}
async function submit(kind, text) {
  if (!dbRef) { say('여기서는 맡길 수 없어요. claude.ai 사무실에서 맡겨 주세요.', true); return; }
  text = (text || '').trim();
  if (kind === 'task' && !text) return;
  if (text.length > 240) { say('240자까지만 적을 수 있어요.', true); return; }
  if (CMD.test(text)) { say('명령어처럼 보이는 글은 받지 않아요. 하고 싶은 일을 말로 적어 주세요.', true); return; }
  const t = target(), hold = RISK.test(text);
  const r = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), at: new Date().toISOString(), kind, text, to: t.id, toName: t.name, status: hold ? 'hold' : 'new' };
  try { await dbRef.collection('requests').doc(r.id).set(r); } catch { say('기록하지 못했어요. 잠시 뒤에 다시 눌러 주세요.', true); return; }
  tb.text.value = '';
  if (hold) { say('설치·삭제·돈·밖으로 보내기가 들어 있어서 대표실 앞에 세워 뒀어요. "맡긴 일"에서 확인하면 맡겨요.'); return; }
  say(await notifyBoss(r) ? `${t.name}에게 맡겼어요. 이음이 읽고 나눠 줄게요.` : '기록해 뒀어요. 이음이 다음에 확인할 때 나눠 줘요.');
}
// ---------- 눌러서 보기: 하는 일 카드, 승인 줄 ----------
const pop = document.getElementById('pop');
let popFor = null;
function closePop() { pop.hidden = true; popFor = null; }
function openPop(html, key) {
  pop.innerHTML = '<button class="x" type="button" aria-label="닫기">×</button>' + html; pop.hidden = false; popFor = key;
  pop.querySelector('.x').onclick = closePop;
  pop.onpointerdown = e => e.stopPropagation();
}
function showPerson(id) {
  const s = state?.sessions.find(x => x.id === id); if (!s) return;
  const room = (ROOMS.find(r => r.id === s.room) || {}).name || '';
  const mine = reqs.filter(r => (r.to === s.id || (r.to === 'boss' && s.room === 'tower')) && r.status !== 'done');
  const KO = { hold: '확인 대기', new: '접수', assigned: '하는 중' };
  const what = s.bubble || (window.claude ? STATE_KO[s.state] : '자세한 내용은 claude.ai 사무실에서 보여요.');
  openPop(`<h3>${esc(roleName(s))}</h3>
    <div class="sub"><span class="chip ${s.state}">${STATE_KO[s.state]}</span> ${esc(room)} · ${ago(s.lastAt, state.now)}</div>
    <div class="what">${esc(what)}</div>
    ${mine.length ? `<b style="font-size:11.5px">맡긴 일 ${mine.length}</b><ul>${mine.map(r => `<li><span>${esc(r.text || QUICK[r.kind] || '맡긴 일')}</span><span class="chip ${esc(r.status)}">${KO[r.status] || esc(r.status)}</span></li>`).join('')}</ul>` : ''}
    ${dbRef ? '<div class="sub" style="margin:8px 0 0">아래 칸에 쓰면 이 사람에게 맡겨져요.</div>' : ''}`, 'p:' + id);
}
function showQueue() {
  const hold = reqs.filter(r => r.status === 'hold');
  if (!hold.length) return closePop();
  openPop(`<h3>확인 대기 ${hold.length}</h3><div class="sub">설치·삭제·돈·밖으로 보내기가 들어간 일이에요. 승인하면 이음에게 넘어가요.</div>
    <ul>${hold.map(r => `<li data-id="${esc(r.id)}"><span>${esc(r.text || '맡긴 일')}<br><small style="color:var(--muted)">${esc(r.toName || '이음 대표')}</small></span>
      ${dbRef ? '<span style="display:flex;gap:4px"><button class="ok" type="button">승인</button><button class="no" type="button">취소</button></span>' : '<a class="go" href="https://claude.ai/artifact/S5gQbxim4p8CeTrLJEWU8n" target="_blank" rel="noopener">승인하러 가기</a>'}</li>`).join('')}</ul>`, 'q');
  pop.querySelectorAll('li[data-id] button').forEach(b => b.onclick = async () => { await holdAnswer(b.closest('li').dataset.id, b.classList.contains('ok'), b); });
}
function refreshPop() { if (pop.hidden) return; if (popFor === 'q') showQueue(); else if (popFor?.startsWith('p:')) showPerson(popFor.slice(2)); }
document.getElementById('world').addEventListener('pointerdown', e => { if (!e.target.closest('.av, .queue')) closePop(); });

async function holdAnswer(id, ok, btn) {
  const r = reqs.find(x => x.id === id); if (!r || !dbRef) return;
  btn.disabled = true;
  try {
    if (!ok) { await dbRef.collection('requests').doc(id).delete(); say('취소했어요.'); return; }
    await dbRef.collection('requests').doc(id).update({ status: 'new', confirmedAt: new Date().toISOString() });
    say(await notifyBoss({ ...r }) ? '확인했어요. 이음에게 맡겼어요.' : '확인했어요. 이음이 다음에 확인할 때 나눠 줘요.');
  } catch { say('바꾸지 못했어요. 잠시 뒤에 다시 눌러 주세요.', true); btn.disabled = false; }
}
document.getElementById('tb-form').onsubmit = e => { e.preventDefault(); submit('task', tb.text.value); };
document.querySelectorAll('.tb-quick button').forEach(b => b.onclick = () => submit(b.dataset.q, b.dataset.q === 'first' ? tb.text.value : ''));
tb.clear.onclick = () => { selected = null; render(); };

function renderSide(visible) {
  document.getElementById('count').textContent = `${visible.filter(s => s.state !== 'idle').length}명 근무 중`;
  const room = Object.fromEntries(ROOMS.map(r => [r.id, r.name]));
  const rank = s => s.room === 'tower' ? 0 : s.room === 'rue' ? 1 : 2;
  visible = [...visible].sort((a, b) => rank(a) - rank(b));
  const boss = (floor === '*' || floor === '2F') && !proj ? `
    <div class="person-row boss-row"><div class="ava" style="background:#86C98F">규</div>
      <div class="meta"><b>규연 총괄</b><div class="sub">2F · 최종 컨펌</div></div></div>` : '';
  const sideRank = s => rank(s) < 2 ? -1 : /^rue/.test(s.id) ? 1 : /^codex/.test(s.id) ? 2 : 0;
  visible = [...visible].sort((a, b) => rank(a) - rank(b) || sideRank(a) - sideRank(b));
  const rows = visible.map(s => `
    <div class="person-row" data-id="${esc(s.id)}">
      <div class="ava" style="background:${rank(s) === 0 ? '#E9846F' : rank(s) === 1 ? '#5DB8E6' : s.color || colorOf(s.project)}">${esc((roleName(s) || '?')[0])}</div>
      <div class="meta"><b>${s.isSubagent ? '↳ ' : ''}${esc(roleName(s))}</b>
        <div class="sub">${esc(room[s.room])}${s.bubble ? ' · ' + esc(s.bubble) : ''}</div>
        <div class="sub">${roomFloor[s.room]} · ${ago(s.lastAt, state.now)}</div></div>
      <span class="chip ${s.state}">${STATE_KO[s.state]}</span></div>`);
  const nBoss = visible.filter(s => rank(s) < 2).length;
  rows.splice(nBoss, 0, boss);
  // 1층 작업 창은 누구 쪽인지로 묶어서: 이음 쪽(Claude 스레드) / 루에 쪽 / Codex
  const side = s => /^rue/.test(s.id) ? '루에 쪽' : /^codex/.test(s.id) ? 'Codex' : '이음 쪽';
  let last = '';
  const out = rows.slice(0, nBoss + 1);
  visible.slice(nBoss).map((s, i) => { const g = side(s); if (g !== last) { out.push(`<div class="side-head">${g}</div>`); last = g; } out.push(rows[nBoss + 1 + i]); });
  rows.length = 0; rows.push(...out);
  document.getElementById('list').innerHTML = visible.length || boss ? rows.join('')
    : `<div class="empty">이 층엔 아무도 없어요.</div>`;
  document.querySelectorAll('.person-row:not(.boss-row)').forEach(el => el.onclick = () => { selected = el.dataset.id; render(); showPerson(el.dataset.id); });
  const ids = new Set(visible.map(s => s.id));
  document.getElementById('log').innerHTML = state.log.filter(l => ids.has(l.who)).slice(-60).reverse().map(l => `
    <li><time>${new Date(l.at).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}</time>
    <div><b>${esc(l.name)}</b><br>${esc(l.text)}</div></li>`).join('') || `<li><span></span><span class="muted">새 활동이 생기면 여기에 쌓여요.</span></li>`;
}

// ---------- 프로젝트별 보기 ----------
// 프로젝트 = 작업 이름. 빨강 = 막힘(답 기다림), 초록 = 작업 중, 회색 = 쉬는 중. 막힌 것부터.
let proj = store.get('vs-proj') || '';
const projOf = s => s.room === 'tower' ? '이음 대표' : roleName(s);
function renderProjects() {
  const g = new Map();
  for (const s of state.sessions) {
    const k = projOf(s), o = g.get(k) || { k, stuck: false, go: false, at: 0 };
    if (s.state === 'thinking') o.stuck = true; // '답 기다림' = 규연 답을 기다리는 중
    if (s.state === 'working') o.go = true;
    o.at = Math.max(o.at, s.lastAt); g.set(k, o);
  }
  if (proj && !g.has(proj)) proj = '';
  const rank = o => o.stuck ? 0 : o.go ? 1 : 2;
  const list = [...g.values()].sort((a, b) => rank(a) - rank(b) || b.at - a.at);
  const box = document.getElementById('projbar');
  box.innerHTML = `<button class="pj ${proj ? '' : 'on'}" data-k="">전체 ${list.length}</button>` + list.map(o =>
    `<button class="pj ${proj === o.k ? 'on' : ''}" data-k="${esc(o.k)}" title="${o.stuck ? '막힘: 답 기다림' : o.go ? '작업 중' : '쉬는 중'}"><i class="${o.stuck ? 'stuck' : o.go ? 'go' : ''}"></i><span>${esc(o.k)}</span></button>`).join('');
  box.querySelectorAll('.pj').forEach(el => el.onclick = () => {
    proj = proj === el.dataset.k ? '' : el.dataset.k; store.set('vs-proj', proj);
    if (proj) { // 그 프로젝트가 있는 층으로
      const fl = new Set(state.sessions.filter(s => projOf(s) === proj).map(s => roomFloor[s.room]));
      floor = fl.size === 1 ? [...fl][0] : '*'; store.set('vs-cloud-floor2', floor);
    }
    render(); fit();
  });
}

function render() {
  if (!state) return;
  renderFloors();
  renderProjects();
  const visible = state.sessions.filter(s => (floor === '*' || roomFloor[s.room] === floor) && (!proj || projOf(s) === proj));
  renderPeople(state.sessions);
  renderSide(visible);
  renderTaskbar();
  refreshPop();
}

document.getElementById('legend').innerHTML = ROOMS.map(r => `<div><i style="background:${shade(r.color, .85)}"></i><span><b>${r.name}</b> <span class="muted">${r.what}</span></span></div>`).join('');


// ---------- 저장된 사무실 상태 읽기 ----------
// Claude가 "사무실 갱신" 요청을 받을 때 db의 snapshot/current 문서를 새로 채운다.
const live = document.getElementById('live');
const notice = document.getElementById('notice');
function showNotice(msg) { notice.hidden = false; notice.querySelector('p').textContent = msg; }
function fromSnapshot(v) {
  const sessions = (v.people || []).map(p => ({
    id: p.id, project: p.floor || 'plan', name: p.name || '제목 없는 작업', isSubagent: false,
    // 2층(대표층)은 이음 대표·루에 대표·규연 총괄만. 다른 작업 창은 모두 1층 '내 자리'로 (규연 10-20)
    room: roomFloor[p.room] === '2F' && p.room !== 'tower' && p.room !== 'rue' ? 'desk' : roomFloor[p.room] ? p.room : 'desk', state: p.state || 'waiting', bubble: p.bubble || '',
    toolCount: 0, lastAt: Date.parse(p.lastAt) || 0, color: /^#[0-9a-f]{6}$/i.test(p.color || '') ? p.color : '',
  })).sort((a, b) => b.lastAt - a.lastAt);
  // 색 구분: Claude는 주황, Codex는 파스텔 블루(이음·루에는 그림)
  sessions.forEach(x => { if (!/^rue/.test(x.id)) x.color = /^codex/.test(x.id) ? '#9CC8EE' : '#EE9F8E'; });
  const log = (v.log || []).map(l => ({ at: Date.parse(l.at) || 0, who: l.id, name: l.name, text: l.text })).sort((a, b) => a.at - b.at);
  return { now: Date.now(), floors: (v.floors || []).map(name => ({ name, sessions: 0, lastAt: 0 })), sessions, log };
}
let snapAt = 0;
function stamp() {
  if (!snapAt) return;
  live.textContent = `● ${ago(snapAt, Date.now())} 기준`;
  live.classList.toggle('off', Date.now() - snapAt > 60 * 60000);
}
// claude.ai 밖(폰 앱용 깃허브 페이지)에서는 같은 폴더의 data.json을 읽음
async function loadFile() {
  try {
    const v = await (await fetch('data.json?t=' + Date.now(), { cache: 'no-store' })).json();
    reqs = v.requests || [];
    notice.hidden = true; snapAt = Date.parse(v.at) || 0; state = fromSnapshot(v); render(); stamp();
  } catch { live.textContent = '● 불러올 수 없음'; }
}
async function startData() {
  if (!window.claude) {
    // 공개 앱: 맡기기는 claude.ai 사무실에서만
    document.getElementById('taskbar').innerHTML = '<a class="tb-link" href="https://claude.ai/artifact/S5gQbxim4p8CeTrLJEWU8n" target="_blank" rel="noopener">✍️ 일 맡기기 (claude.ai 사무실에서 열기)</a>';
    loadFile(); document.addEventListener('visibilitychange', () => { if (!document.hidden) loadFile(); }); live.style.cursor = 'pointer'; live.title = '눌러서 새로 읽기'; live.onclick = () => { live.textContent = '● 새로 읽는 중'; loadFile(); }; return; }
  const db = window.claude?.use ? await window.claude.use('db') : null;
  if (!db) { live.textContent = '● 불러올 수 없음'; showNotice('저장된 사무실 상태를 읽지 못했어요. claude.ai에 로그인한 상태로 열어 주세요.'); return; }
  dbRef = db;
  db.collection('requests').onSnapshot(qs => { reqs = qs.docs.map(d => d.data()); if (state) render(); }, () => {});
  db.doc('snapshot/current').onSnapshot((d) => {
    if (!d.exists) { live.textContent = '● 아직 비어 있음'; showNotice('아직 채워진 상태가 없어요. 이음에게 "사무실 갱신"이라고 말하면 지금 상태로 채워요.'); return; }
    const v = d.data();
    notice.hidden = true;
    snapAt = Date.parse(v.at) || 0;
    state = fromSnapshot(v); render(); stamp();
  }, () => { live.textContent = '● 불러올 수 없음'; });
}
drawMap(); setWide(store.get('vs-wide') === '1'); startData();
setInterval(stamp, 30000);
</script>
