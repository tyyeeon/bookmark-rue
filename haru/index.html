<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
<script src="theme.js?v=6" data-theme="1"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#dae7d1">
  <title>하루</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="하루">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
  <link rel="stylesheet" href="styles.css?v=6">
</head>
<body>
<div class="haru-app" id="haru-v4">
  <!-- 승인된 표지와 내부 4화면: 모든 버튼/필드 ID 유지 -->
  <div class="cover" id="cover">
    <img class="cover-img" src="assets/cover.jpg" alt="숲빛이 비치는 유리 달력">
    <button class="start-hotspot" id="start" type="button" aria-label="하루 시작하기"><span class="sr-only">하루 시작하기</span></button>
  </div>
  <div class="shell">
    <aside class="sidebar" aria-label="주 메뉴"><div class="brand">하루<span class="spark" aria-hidden="true">✦</span></div><div id="desktop-nav"></div></aside>
    <main class="main">
      <header class="top">
        <div><h1>하루<span class="spark" aria-hidden="true">✦</span></h1><p class="top-date">나의 시간을 담는 곳</p></div>
        <div class="top-actions"><button id="home-cover" class="round" type="button" aria-label="시작 화면 보기"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m4 11 8-7 8 7v9H4Z"/><path d="M9 20v-7h6v7"/></svg></button><button class="add" id="add" type="button">＋ 추가</button></div>
      </header>
      <p class="sync-message" id="sync" role="alert" style="display:none"></p>
      <div class="filters" id="filters" aria-label="그룹 필터">
        <button type="button" class="chip active" data-group="전체" aria-pressed="true">전체</button>
        <button type="button" class="chip" data-group="규연" aria-pressed="false"><i class="dot group-gyuyeon" aria-hidden="true"></i>규연</button>
        <button type="button" class="chip" data-group="숲녘" aria-pressed="false"><i class="dot group-soop" aria-hidden="true"></i>숲녘</button>
        <button type="button" class="chip" data-group="연가당" aria-pressed="false"><i class="dot group-yeon" aria-hidden="true"></i>연가당</button>
      </div>
      <section class="view active" id="monthly" aria-label="월간 달력">
        <div class="calendar">
          <div class="cal-head"><button class="arrow" id="prev" type="button" aria-label="이전 달">‹</button><div class="month-title" id="month-label">월간</div><div class="cal-controls"><button class="tiny" id="today-btn" type="button">오늘</button><button class="arrow" id="next" type="button" aria-label="다음 달">›</button></div></div>
          <div class="weekdays" aria-hidden="true"><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div><div>일</div></div>
          <div class="days" id="days" aria-label="날짜"></div>
          <div class="cal-bottom"><span></span><button class="toggle" id="calendar-only" type="button" aria-pressed="false">달력만 보기<span class="switch" aria-hidden="true"></span></button></div>
        </div>
        <div class="agenda" id="agenda"><button class="handle" id="handle" type="button" aria-label="일정 패널 접기 또는 펼치기"></button><div class="agenda-head"><div class="agenda-title" id="selected-label">선택한 날짜</div><button class="small-link" id="agenda-add" type="button">＋ 추가</button></div><div id="agenda-list" aria-live="polite"></div></div>
      </section>
      <section class="view" id="weekly" aria-label="주간 일정"><div class="calendar week-calendar"><div class="cal-head"><button class="arrow" id="week-prev" type="button" aria-label="이전 주">‹</button><div class="month-title" id="week-label">주간</div><button class="arrow" id="week-next" type="button" aria-label="다음 주">›</button></div><div class="week-strip" id="week-strip"></div><div class="timeline" id="timeline"></div></div></section>
      <section class="view" id="tasks" aria-label="오늘 할 일"><div class="calendar task-card"><div class="agenda-head"><div class="task-title-group"><h2 class="section-heading" id="task-date">오늘 할 일</h2><div class="today-tools" id="task-progress"></div></div><button class="small-link" id="task-add" type="button">＋ 추가</button></div><div id="task-list" aria-live="polite"></div></div><div class="agenda today-agenda"><div class="agenda-head"><h2 class="section-heading">오늘 일정</h2><button class="small-link" id="today-event-add" type="button">＋ 추가</button></div><div id="today-events" aria-live="polite"></div></div></section>
      <section class="view" id="settings" aria-label="설정"><h2 class="settings-heading">설정</h2><div class="settings-list">
        <div class="settings-row"><span class="setting-label"><span class="setting-symbol" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18h1a2 2 0 0 0 1-4c-1-1 0-3 2-3h2a3 3 0 0 0 3-3c0-5-4-8-9-8Z"/><circle cx="7" cy="11" r=".7"/><circle cx="9" cy="7" r=".7"/><circle cx="14" cy="7" r=".7"/><circle cx="17" cy="10" r=".7"/></svg></span>테마</span><span>숲빛 유리</span></div>
        <div class="settings-row"><span class="setting-label"><span class="setting-symbol" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/></svg></span>시간대</span><span>대한민국 · KST</span></div>
        <div class="settings-row"><span class="setting-label"><span class="setting-symbol" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="3"/><path d="M8 3v4m8-4v4M4 10h16"/></svg></span>한 주의 시작</span><span>월요일</span></div>
        <div class="settings-row"><span class="setting-label"><span class="setting-symbol" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6Z"/><path d="M14 3v5h5M9 12h7m-7 4h7"/></svg></span>저장 방식</span><span>구글 시트 「일정표」</span></div>
        <div class="settings-row"><span class="setting-label"><span class="setting-symbol" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21v-3a7 7 0 0 1 14 0v3Zm14-17a4 4 0 0 1 0 8m3 9h3v-3a7 7 0 0 0-4-6"/></svg></span>함께 쓰는 사람</span><span>규연 · 루에 · 이음</span></div>
        <div class="settings-row"><span class="setting-label"><span class="setting-symbol" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 17h14l-2-3V9a5 5 0 0 0-10 0v5Zm5 3h4M12 2v2"/></svg></span>알림</span><span>구글 캘린더<small>이음 등록</small></span></div>
        </div><details class="maintenance"><summary>일정 연결 및 복원</summary><div class="settings-row compact no-chevron"><span class="setting-label">일정 수</span><span id="event-count">—</span></div>
      <div class="group-list" id="setting-groups"></div><details class="trash-panel"><summary class="trash-heading">삭제된 일정 · 복원</summary><div id="trash-list"></div></details><button class="glass-button" id="reload" type="button">↻ 새로고침</button></details><div class="setting-actions"><button class="glass-button" id="show-cover" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>시작 화면 보기</button></div></section>
    </main>
    <nav class="mobile-nav" id="mobile-nav" aria-label="주 메뉴">
      <button class="active" type="button" data-view="monthly" aria-current="page"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="16" rx="3"/><path d="M8 3v4m8-4v4M4 11h16m-11 4h1m4 0h1"/></svg><span>월간</span></button>
      <button type="button" data-view="weekly"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="16" rx="3"/><path d="M8 3v4m8-4v4M4 11h16M9 11v10m6-10v10"/></svg><span>주간</span></button>
      <button type="button" data-view="tasks"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg><span>오늘 할 일</span></button>
      <button type="button" data-view="settings"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 3-1 3-3 1v3l-2 2 2 2v3l3 1 1 3h6l1-3 3-1v-3l2-2-2-2V7l-3-1-1-3Z"/><circle cx="12" cy="12" r="3"/></svg><span>설정</span></button>
    </nav>
  </div>
  <div class="dialog-backdrop" id="dialog"><form class="dialog" id="event-form" aria-labelledby="dialog-title">
    <div class="dialog-head"><h2 id="dialog-title">새 일정</h2><button type="button" id="close-dialog" class="close-button" aria-label="닫기">×</button></div>
    <label class="field" for="f-title">제목<input id="f-title" name="title" required maxlength="80" placeholder="제목 입력" autocomplete="off"></label>
    <div class="field-pair"><label class="field" for="f-type">유형<select id="f-type" name="type"><option value="event">일정</option><option value="task">할 일</option></select></label><label class="field" for="f-group">그룹<select id="f-group" name="group"><option>규연</option><option>숲녘</option><option>연가당</option></select></label></div>
    <label class="field" for="f-date">날짜<input id="f-date" name="date" type="date" required></label>
    <label class="all-day-field"><input type="checkbox" id="f-all-day"> 종일</label>
    <div class="field-pair"><label class="field" for="f-time">시작 시간<input id="f-time" name="time" type="time"></label><label class="field" for="f-end">끝 시간<input id="f-end" name="end" type="time"></label></div>
    <label class="field" for="f-place">장소<input id="f-place" name="place" maxlength="100" placeholder="장소 입력"></label>
    <label class="field" for="f-note">메모<textarea id="f-note" name="note" rows="3" maxlength="2000" placeholder="기억해 둘 이야기"></textarea></label>
    <p class="form-message" id="f-msg" role="alert" aria-live="assertive"></p>
    <div class="dialog-actions"><button id="f-delete" class="delete-button" type="button" style="display:none">삭제</button><button class="tiny" id="cancel" type="button">취소</button><button class="add" id="f-save" type="submit">저장하기</button></div>
  </form></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<script src="bridge.js?v=6"></script>
<script src="app.js?v=7"></script>
</body>
</html>
