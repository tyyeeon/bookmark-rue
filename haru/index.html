<!doctype html>
<html lang="ko" data-theme="moon">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#bfe3f6">
<title>하루</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="하루">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
<script>try{var t=localStorage.getItem('haru-look');if(t==='green'||t==='moon')document.documentElement.dataset.theme=t;}catch(_){}</script>
<link rel="stylesheet" href="styles.css?v=23">
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<section class="cover" id="cover" aria-label="시작">
  <div class="cover-text">
    <h1>하루</h1>
    <p>일정 · 프로젝트 · 할 일을 한곳에서</p>
  </div>
  <button class="cover-btn" id="start" type="button">시작하기</button>
</section>

<div class="app" id="app">
  <header class="top">
    <h1 class="brand">하루</h1>
  </header>
  <p class="notice" id="notice" hidden></p>

  <main class="main">
    <!-- 달력 -->
    <section class="view" id="v-cal" aria-label="달력">
      <div class="panel cal-panel">
        <div class="cal-head">
          <button class="icon-btn" id="m-prev" type="button" aria-label="이전 달">‹</button>
          <h2 id="m-label">2026년 11월</h2>
          <button class="icon-btn" id="m-next" type="button" aria-label="다음 달">›</button>
          <div class="groups" data-groups></div>
        </div>
        <div class="weekdays" aria-hidden="true"><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span><span class="sun">일</span></div>
        <div class="month" id="month"></div>
      </div>
    </section>

    <!-- 프로젝트 -->
    <section class="view" id="v-proj" aria-label="프로젝트">
      <div class="panel page-panel">
        <h2 class="page-title">프로젝트</h2>
        <div class="seg seg-4" id="p-filter"></div>
        <div class="scroll" id="p-list"></div>
      </div>
    </section>

    <!-- 프로젝트 상세 -->
    <section class="view" id="v-detail" aria-label="프로젝트 상세">
      <div class="panel page-panel">
        <button class="back" id="d-back" type="button">← 프로젝트 상세</button>
        <div class="scroll" id="d-body"></div>
      </div>
    </section>

    <!-- 일정 -->
    <section class="view" id="v-sched" aria-label="일정">
      <div class="panel page-panel">
        <div class="page-row">
          <h2 class="page-title">일정</h2>
          <div class="groups" data-groups></div>
        </div>
        <div class="seg seg-3" id="s-tabs">
          <button type="button" data-tab="week">주간</button>
          <button type="button" data-tab="day">일간</button>
          <button type="button" data-tab="todo">할 일</button>
        </div>
        <div class="strip-wrap" id="strip-wrap">
          <button class="icon-btn" id="w-prev" type="button" aria-label="이전 주">‹</button>
          <div class="strip" id="strip"></div>
          <button class="icon-btn" id="w-next" type="button" aria-label="다음 주">›</button>
        </div>
        <div class="scroll" id="s-list"></div>
        <button class="fab" id="fab" type="button" aria-label="일정 추가">＋<small>일정</small></button>
      </div>
    </section>

    <!-- 설정 -->
    <section class="view" id="v-set" aria-label="설정">
      <div class="panel page-panel">
        <h2 class="page-title">설정</h2>
        <div class="scroll set-list">
          <div class="card set-card">
            <span class="set-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4m8-4v4M4 10h16"/></svg></span>
            <div class="set-main"><b>시작 화면</b>
              <div class="seg seg-3 mini" id="set-start">
                <button type="button" data-start="cal">달력</button><button type="button" data-start="proj">프로젝트</button><button type="button" data-start="sched">일정</button>
              </div>
            </div>
          </div>
          <div class="card set-card">
            <span class="set-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/></svg></span>
            <div class="set-main"><b>테마</b>
              <div class="seg seg-2 mini" id="set-look">
                <button type="button" data-look="green">녹색 유리</button><button type="button" data-look="moon">달빛 유리</button>
              </div>
            </div>
          </div>
          <div class="card set-card">
            <span class="set-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></span>
            <div class="set-main row-between"><div><b>새로고침</b><small id="last-sync">아직 불러오지 않았어요</small></div>
              <button class="pill-btn" id="reload" type="button">↻ 새로고침</button></div>
          </div>
          <div class="card set-card">
            <span class="set-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 7h7l2 2h9v10H3Z"/></svg></span>
            <div class="set-main"><b>관리</b>
              <div class="set-line"><span>그룹 버튼 보이기</span><button class="switch" id="sw-groups" type="button" role="switch" aria-checked="true"><i></i></button></div>
              <div class="set-line"><span>삭제된 일정 복원</span><button class="pill-btn small" id="trash-btn" type="button"><span id="trash-count">0</span> ›</button></div>
              <div id="trash-list" class="trash" hidden></div>
              <div class="set-line"><span>새 기기 링크 복사</span><button class="pill-btn small" id="copy-link" type="button">링크 복사</button></div>
            </div>
          </div>
          <div class="card set-card">
            <span class="set-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg></span>
            <div class="set-main"><b>정보</b>
              <div class="set-line"><span>시간대</span><em>KST</em></div>
              <div class="set-line"><span>한 주의 시작</span><em>월요일</em></div>
              <div class="set-line"><span>저장</span><em>구글 시트 「일정표」</em></div>
              <div class="set-line"><span>함께 쓰는 사람</span><em>규연 · 루에 · 이음</em></div>
              <div class="set-line"><span>앱 버전</span><em>하루 1.0</em></div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <nav class="nav" id="nav" aria-label="주 메뉴">
    <button type="button" data-view="cal"><img class="nic" src="img/ic/m-cal.png" alt=""><span>달력</span></button>
    <button type="button" data-view="proj"><img class="nic" src="img/ic/m-proj.png" alt=""><span>프로젝트</span></button>
    <button type="button" data-view="sched"><img class="nic" src="img/ic/m-sched.png" alt=""><span>일정</span></button>
    <button type="button" data-view="set"><img class="nic" src="img/ic/m-set.png" alt=""><span>설정</span></button>
  </nav>
</div>

<!-- 날짜 목록 (아래에서 올라옴) -->
<div class="sheet-back" id="day-back" hidden></div>
<section class="sheet" id="day-sheet" aria-label="그날 일정" hidden>
  <div class="grab" aria-hidden="true"></div>
  <div class="sheet-head"><h3 id="day-title"></h3><button class="icon-btn" id="day-close" type="button" aria-label="닫기">✕</button></div>
  <div class="sheet-list" id="day-list"></div>
  <button class="pill-btn" id="day-add" type="button">＋ 일정</button>
</section>

<!-- 추가·수정 창 -->
<div class="modal-back" id="form-back" hidden>
  <form class="modal" id="form" novalidate>
    <div class="modal-head"><h3 id="form-title">일정 추가</h3><button class="icon-btn" id="form-close" type="button" aria-label="닫기">✕</button></div>
    <label class="f"><span>제목</span><input id="f-title" maxlength="80" autocomplete="off" placeholder="새 일정"></label>
    <div class="f"><span>종류</span><div class="seg seg-2 mini" id="f-type"><button type="button" data-v="event">일정</button><button type="button" data-v="task">할 일</button></div></div>
    <div class="f"><span>그룹</span><div class="seg seg-2 mini" id="f-group"><button type="button" data-v="규연"><i class="dot g-규연"></i>규연</button><button type="button" data-v="Ella"><i class="dot g-Ella"></i>Ella</button></div></div>
    <label class="f"><span>날짜</span><input id="f-date" type="date"></label>
    <div class="f"><span>종일</span><button class="switch" id="f-allday" type="button" role="switch" aria-checked="false"><i></i></button></div>
    <label class="f" id="f-time-row"><span>시작 시간</span><input id="f-time" type="time"></label>
    <label class="f" id="f-end-row"><span>끝 시간</span><input id="f-end" type="time"></label>
    <label class="f"><span>장소</span><input id="f-place" maxlength="100" autocomplete="off" placeholder="장소 입력"></label>
    <label class="f"><span>메모</span><textarea id="f-note" maxlength="2000" rows="3" placeholder="메모 입력"></textarea></label>
    <p class="form-err" id="form-err" hidden></p>
    <div class="modal-actions">
      <button class="ghost-btn danger" id="f-delete" type="button" hidden>삭제</button>
      <button class="ghost-btn" id="f-cancel" type="button">취소</button>
      <button class="main-btn" id="f-save" type="submit">저장</button>
    </div>
  </form>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script src="bridge.js?v=20"></script>
<script src="app.js?v=23"></script>
</body>
</html>
